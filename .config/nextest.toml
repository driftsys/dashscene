# Test tiers — docs/decisions/test-tiers.md.
#
# The tier lives here rather than in attributes on the tests. An `#[ignore]`
# says "do not run this" at the point the test is defined, which is the wrong
# place to record a schedule that differs per moment: the same test belongs in
# the gate before a push and not in the loop between edits. This file is the
# one place the tiers are defined; `just test`, `just build` and
# `just calibrate` select between them.
#
# The tiers nest. `regression` is a superset of `sanity`; `regression` and
# `calibration` together are the whole suite, except for the `scaling` profile
# at the bottom of this file, which is held outside all three on purpose and
# says why.
#
# Filters use exact matches (`test(=name)`, `binary(=name)`) rather than
# substring matches, so a test added later cannot join a tier by accident of
# its name.
#
# An exact match has one failure mode of its own: rename a test and its filter
# stops matching, so the test leaves its tier without any error. Counting does
# not catch that — the tiers partition the suite, so a test moving from
# `calibration` into `regression` keeps every total reconciling. What catches it
# is `calibration-tier.txt` beside this file, which pins that tier's membership
# by name; `just calibrate` and the CI calibration job both diff the live
# listing against it. A rename fails there, loudly, instead of quietly
# shrinking the tier. Only the calibration tier is pinned this way: its names
# change rarely, where pinning the regression tier's would churn on every test
# added.

# The minimum version this file was written against and verified on.
# Per-profile `default-filter` and exact-match filters both predate it, but
# pinning the floor turns "runs against an old nextest" into a named error
# rather than a filter that parses to something else.
nextest-version = "0.9.87"

# `default` is the regression tier, so a bare `cargo nextest run` gives the
# same gate `just build` runs rather than a thinner one. The ten tests excluded
# here re-derive committed asset tables from the packer alone; they are the
# `calibration` tier. The eleventh exclusion is the startup-scaling criterion,
# which is the `scaling` profile below.
[profile.default]
default-filter = """
not (
    test(=import_image_fill_rows_match_the_table)
  + test(=v03_paint_rows_match_the_table)
  + test(=block_stress_rows_match_the_table)
  + test(=photo_interior_render_rows_match_the_table)
  + test(=photo_coast_forest_rows_match_the_table)
  + test(=photo_snowy_forest_rows_match_the_table)
  + test(=photo_dawn_mountains_rows_match_the_table)
  + test(=inter_ascii_atlas_rows_match_the_table)
  + test(=arabic_atlas_rows_match_the_table)
  + test(=the_recorded_contract_table)
  + binary(=startup_scaling)
)
"""

# An empty profile inherits everything from `default`, including its filter.
# It exists so `-P regression` reads as the tier it selects, rather than
# leaving the gate nameless.
[profile.regression]

# The loop between edits and before every commit. Drops, on top of the
# calibration tier: the profile-preview oracle, the glyph atlas pipeline, the
# bake oracle, and the grid-anchor saturation test. Those cost about 73 s
# together and each is reachable from a narrow part of the tree, so the
# regression tier is where they are caught rather than this one.
[profile.sanity]
default-filter = """
not (
    test(=import_image_fill_rows_match_the_table)
  + test(=v03_paint_rows_match_the_table)
  + test(=block_stress_rows_match_the_table)
  + test(=photo_interior_render_rows_match_the_table)
  + test(=photo_coast_forest_rows_match_the_table)
  + test(=photo_snowy_forest_rows_match_the_table)
  + test(=photo_dawn_mountains_rows_match_the_table)
  + test(=inter_ascii_atlas_rows_match_the_table)
  + test(=arabic_atlas_rows_match_the_table)
  + test(=the_recorded_contract_table)
  + binary(=startup_scaling)
  + binary(=profile_preview_oracle)
  + binary(=atlas_pipeline)
  + test(=an_out_of_range_grid_anchor_does_not_panic)
  + binary(=v010_bake_oracle)
)
"""

# The ten tests that re-derive a committed table from the packer alone: one per
# calibration fixture, plus the band contract's own table. They can only fail
# when dashpack, its encoder, dashbuf's asset kinds, or the corpus payloads
# change, which is what makes a narrow path filter correct for them in CI.
#
# One test per fixture rather than one walk over all nine, so that nextest can
# run them concurrently — as a single test the walk was sixty-three encodes in
# one process and it alone set the tier's wall clock (issue #660).
#
# The profile-preview oracle is deliberately NOT here, though it also checks a
# committed table. It renders every scene through Skia, so it reads the whole
# painter stack and almost any Rust change can move it — no path filter could
# honestly cover it. It runs in `regression`, on every push, instead.
[profile.calibration]
default-filter = """
    test(=import_image_fill_rows_match_the_table)
  + test(=v03_paint_rows_match_the_table)
  + test(=block_stress_rows_match_the_table)
  + test(=photo_interior_render_rows_match_the_table)
  + test(=photo_coast_forest_rows_match_the_table)
  + test(=photo_snowy_forest_rows_match_the_table)
  + test(=photo_dawn_mountains_rows_match_the_table)
  + test(=inter_ascii_atlas_rows_match_the_table)
  + test(=arabic_atlas_rows_match_the_table)
  + test(=the_recorded_contract_table)
"""

# The startup-scaling criterion — the falsifiable form of R5 under guardrail
# G-20 (story #598, epic #594). Run by `just scaling`.
#
# A profile of its own, and deliberately not a fourth tier — the reasoning is in
# docs/decisions/test-tiers.md. The criterion is **written to fail** against the
# pre-slice load path, and epic #594's definition of done requires that failure
# to be demonstrated by running it rather than asserted. Holding it out of
# `sanity` and `regression` keeps the gate `just build` runs green while the
# criterion is openly red; when stories #595, #596 and #597 land and it passes,
# it moves into `regression` like any other test, this profile goes away, and a
# regression in it fails a build.
#
# The whole binary rather than the criterion alone. The other two tests in it
# are the criterion's own guards — that the many-frame document really carries
# one distinct payload per frame, and that both halves of the byte counter
# record — and a guard that runs at a different moment from the thing it guards
# is a guard nobody reads. They cost about 3 s together with the criterion; each
# test builds its own documents, so nothing here is shared state and the three
# run concurrently.
#
# `all` below still runs it, so `just test-all` is red until the slice closes.
# That is the criterion being visible rather than a fault: its assertion message
# names the epic and the three stories it waits on.
[profile.scaling]
default-filter = "binary(=startup_scaling)"

# Every tier in one run.
[profile.all]
default-filter = "all()"

# The v0 exit gate (story #49, epic #47). Every test named here is a criterion's
# covering test, as `docs/specification/05-qualification.md` evidences them. The
# gate exists so that a regression in any one criterion fails a build rather
# than being noticed by a person.
#
# E6 is only half here. It is proven by two suites in two CI jobs that never
# meet — the native library call below, and `importers/figma/src/wasm_test.ts`
# from Deno — each asserting against the same committed bytes, which is what
# makes the identity transitive. A Rust filter cannot express the Deno half, so
# the CI `exit-gate` job requires the `deno` job as well.
#
# E2, E3 and E7 name a whole binary rather than a test. "The stress corpus is
# green" and "the oracle measures every frame" are claims about a suite rather
# than about one case, and naming the binary means a case added later is
# covered without anyone remembering to add it here. E2 is here for a sharper
# reason: its pixel golden is the coarse half — the text ink is a few per cent
# of the canvas — and the glyph-level companion that pins each feature is the
# evidence that would actually catch a shaping regression. Naming one test
# would have pinned the weaker one and let the stronger be deleted silently.
[profile.exit-gate]
default-filter = """
    test(=the_same_screen_authored_both_ways_is_bit_identical)
  + binary_id(=goldens::v06_arabic)
  + binary_id(=dashlang::corpus)
  + test(=the_reject_fixture_is_refused_rather_than_emitted)
  + test(=each_diagnostic_points_at_its_own_node)
  + test(=variant_transition_goldens_at_t_0_half_and_1)
  + test(=the_fixture_compiles_to_the_golden_dsb)
  + binary_id(=goldens::render_oracle)
"""
