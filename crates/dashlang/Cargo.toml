[package]
name = "dashlang"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Rust DSL skin over the dashscene-core producer surface, and the stress-corpus generator (docs/design/architecture.md, docs/decisions/staged-mutation-v01-scope.md)."

[lib]
name = "dashlang"

[dependencies]
dashscene-core.workspace = true
# The reactive layer smooths bound props through dashcue's scheduler and
# reuses its opaque `PropKey` as the binding address (docs/archive/
# 2026-07-14-scope-decisions.md §23 D1). dashlang depending on both core
# and dashcue is what keeps core clear of the animation crate (SCOPE §9).
# The key's packing math is core's `prop_key` (one packing everywhere,
# debt #208), so no engine dependency is needed to build a key.
dashcue.workspace = true

[dev-dependencies]
# The reflow acceptance cases (A3/A4) need the real flex/`Display::None`
# solve, which lives in the engine. A dev-dependency only: dashlang's
# library never depends on the engine (the solver is injected).
dashscene-engine.workspace = true
