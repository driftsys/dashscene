[package]
name = "dashscene-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Runtime that resolves the model: Taffy solve, variants, FLIP, measure callback (docs/design/architecture.md)."
keywords = ["layout", "flexbox", "taffy", "ui", "graphics"]
categories = ["gui", "graphics"]

[lib]
name = "dashscene_engine"

[dependencies]
dashcue.workspace = true
dashscene-core.workspace = true
# `image_id::identify`, for the sheet header check in
# `TextResources::from_faces`. `dashscene-core` re-exports every paint type
# this crate names, so that is the one item only `dashpaint` publishes.
# `dashpaint` has no dependencies of its own, so this edge adds nothing to
# the graph but the name.
dashpaint.workspace = true
dashscene-typeset.workspace = true
rustc-hash.workspace = true
taffy.workspace = true
