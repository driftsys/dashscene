[package]
name = "dashpack"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Asset packer: encodes canonical payloads into per-profile derivations, assembles cold banks, and records every choice in the derivation manifest (docs/design/architecture.md, epic #345)."
keywords = ["assets", "texture", "astc", "ktx2", "compression"]
categories = ["compression", "rendering::data-formats"]

[lib]
name = "dashpack"

[[bin]]
name = "dashpack"
path = "src/main.rs"

[features]
# The Gfx QA profile preview (story #435): software decode of a derived block
# payload back to RGBA, so the Skia reference painter can render a HiFi or Lite
# bank on a desk. Off by default, because the packer binary only ever writes
# banks and pulling a reader onto its emit-side dependency list would put a
# third party's parser in the shipping tool. `goldens` turns it on.
preview = ["dep:ktx2"]

[dependencies]
# The asset schema. `dashpack::profile` reads `AssetEntry.kind` to apply its
# hard rules before any measurement runs, which is the coupling the
# asset-pipeline plan named when it placed this crate in the workspace (#432).
dashbuf = { workspace = true }
# The vendored, version-pinned astcenc — the encoder and the reference decoder,
# linked in process, with no external binary (story #430).
dashpack-astcenc-sys = { workspace = true }
# Zstd supercompression for the KTX2 level payloads (story #431).
zstd = { workspace = true }
# Content addressing. A packed asset's canonical identity is the BLAKE3 of its
# canonical payload, computed here rather than taken from the caller, so a
# derivation cannot be bound to an identity it does not belong to (story #434).
blake3 = { workspace = true }
# An independently written KTX2 parser. Optional, and reached only through the
# `preview` feature: the writer is ours, and a check is worth more when someone
# else wrote it (story #431), so the emit path never sees it. The preview path
# is a *read* path, so it reads with this same independent parser rather than
# with an inverse of our own writer (story #435).
ktx2 = { workspace = true, optional = true }

[dev-dependencies]
# The same parser, unconditionally, for `dashpack::ktx2`'s own round-trip tests
# — they read back what the writer emits whether or not `preview` is enabled.
ktx2 = { workspace = true }
# Decodes the committed corpus PNGs the band contracts are measured on. A test
# dependency for now: the packer's canonical-to-RGBA ingest is a later story,
# and `dashpack::profile` takes texels rather than encoded bytes (story #432).
png = { workspace = true }
