[package]
name = "dashpack"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Asset packer: encodes canonical payloads into per-profile derivations, assembles cold banks, and records every choice in the derivation manifest (docs/design/architecture.md, epic #345)."

[lib]
name = "dashpack"

[[bin]]
name = "dashpack"
path = "src/main.rs"

[dependencies]
# The asset schema. `dashpack::profile` reads `AssetEntry.kind` to apply its
# hard rules before any measurement runs, which is the coupling the
# asset-pipeline plan named when it placed this crate in the workspace (#432).
dashbuf = { workspace = true }
# The vendored, version-pinned astcenc — the encoder and the reference decoder,
# linked in process, with no external binary (story #430).
dashpack-astcenc-sys = { workspace = true }
# Zstd supercompression for the KTX2 level payloads (story #431).
zstd = { workspace = true }

[dev-dependencies]
# An independently written KTX2 parser, used only to read back what
# `dashpack::ktx2` emits. It is a test dependency on purpose: the writer is
# ours, and a check is worth more when someone else wrote it (story #431).
ktx2 = { workspace = true }
# Decodes the committed corpus PNGs the band contracts are measured on. A test
# dependency for now: the packer's canonical-to-RGBA ingest is a later story,
# and `dashpack::profile` takes texels rather than encoded bytes (story #432).
png = { workspace = true }
