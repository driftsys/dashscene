[package]
name = "dashpack-astcenc-sys"
version.workspace = true
edition.workspace = true
# The binding code, the build script and the vendored sources under
# `vendor/astcenc` are all Apache-2.0 — the workspace licence and Arm's are now
# the same one, so this crate no longer needs a compound expression. Arm's SPDX
# headers and copyright notices in the vendored tree are unmodified. See
# vendor/VENDOR.md.
license = "Apache-2.0"
repository.workspace = true
rust-version.workspace = true
description = "Raw bindings to a vendored, version-pinned astcenc — the ASTC encoder and reference decoder dashpack links, with no external binary (story #430)."
keywords = ["astc", "astcenc", "texture", "ffi", "sys"]
categories = ["external-ffi-bindings", "compression"]
# A -sys crate declares the native library it provides, so cargo refuses a build
# that would link two copies of it into one artifact.
links = "dashpack_astcenc"
build = "build.rs"

[lib]
name = "dashpack_astcenc_sys"

[build-dependencies]
cc = { workspace = true }
