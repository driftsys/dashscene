[package]
name = "dashscene-typeset"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "One typesetter: bidi split, rustybuzz shaping, glyph atlas pipeline (docs/design/architecture.md)."
keywords = ["text", "shaping", "bidi", "msdf", "fonts"]
categories = ["text-processing", "rendering"]

[lib]
name = "dashscene_typeset"

[dev-dependencies]
# The reproducibility tests compare decoded atlas samples, not PNG bytes,
# so the assertion is about the atlas rather than about the encoder
# (story #654).
png.workspace = true

[dependencies]
ttf-parser.workspace = true
rustybuzz.workspace = true
unicode-bidi.workspace = true
unicode-properties.workspace = true
serde.workspace = true
postcard.workspace = true
serde_json.workspace = true
tempfile.workspace = true
