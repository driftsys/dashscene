[package]
name = "dashscene-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The C ABI every platform host sits on: runtime lifecycle, document load, the tick, the surface handoff, and the committed frame for a host that draws it itself (docs/decisions/host-integration-in-three-layers.md, D2)."
keywords = ["ffi", "abi", "bindings", "embedding", "graphics"]
categories = ["external-ffi-bindings", "graphics"]

[lib]
name = "dashscene_ffi"
# `rlib` so the workspace's own tests can link it as a Rust crate; `cdylib` and
# `staticlib` because a platform host loads it as a library and not as a crate.
# JNI wants the first, and an iOS or Unity host in v1 wants the second.
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
# The same set `dashscene-desktop` takes, minus `winit`: this crate is what a
# host uses *instead of* a windowing library, so it takes none.
dashscene-core.workspace = true
# Boundary B's `Painter` trait, whose `paint` the draw call invokes.
# `dashscene-desktop` takes it for the same reason.
dashpaint.workspace = true
dashlang.workspace = true
dashscene-engine.workspace = true
dashbuf.workspace = true
dashscene-validator.workspace = true
# The painter, for the surface handoff. This crate names no `wgpu` type at all:
# the `ANativeWindow` wrapper lives in `SurfaceRenderer::for_android_ndk`,
# beside `for_canvas`. `crates/dashscene-gpu/Cargo.toml` records that property
# for the canvas case: the wrapping happens in the painter so a host names no
# `wgpu` type.
dashscene-gpu.workspace = true

[dev-dependencies]
# The mapped-load tests need a file to map, and a mapping is of a path — so the
# one thing they cannot do is work from bytes in memory. The same reason
# `dashscene-desktop` and `dashbuf` carry it.
tempfile.workspace = true
# Those tests build a two-root document, which no committed fixture is: every
# `goldens/dsb` fixture has one root, and over a one-root document "the shown
# root's assets" and "every asset in the file" are the same set, so nothing
# built from one can tell a bounded load from an unbounded one.
flatbuffers.workspace = true
# An `AssetEntry` names its payload's canonical BLAKE3, so building a document
# by hand means computing one. `dashbuf` uses it for the same reason and does
# not re-export it.
blake3.workspace = true
# The boundary-B gate, for one test only: it asks whether every gated row type
# either crosses in a `DsFrame` or is named as deliberately not crossing, so a
# type added to that surface cannot be forgotten here. A dev-dependency rather
# than a dependency — the shipped library links none of its symbols, and
# `docs/decisions/crate-name-map.md` records that they are not re-exported.
dashpaint-abi = { path = "../dashpaint-abi" }
