[package]
name = "dashscene-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The lean painter: instanced quads and analytic SDF over wgpu, covering native and web from one codebase (docs/decisions/wgpu-is-the-lean-painter.md)."
keywords = ["wgpu", "gpu", "sdf", "rendering", "graphics"]
categories = ["graphics", "rendering::graphics-api"]

[lib]
name = "dashscene_gpu"

[features]
# GPU execution time, from the device's own timestamps (v0.21, epic #1107).
#
# **Off by default, and that is the whole point.** Turning it on adds two
# feature bits to the device request — `TIMESTAMP_QUERY` and
# `TIMESTAMP_QUERY_INSIDE_ENCODERS`, both of which the encoder bracketing needs
# — and the shipped painter otherwise requests no features beyond the ASTC bit
# it bakes with. A shipped painter whose device request depends on a build flag
# would make every D3a statement conditional on how it was compiled.
#
# The limits are a separate axis and this feature does not touch them: the
# painter asks for `Limits::downlevel_defaults().using_resolution(adapter
# .limits())`, not bare `downlevel_defaults`, and `dashscene-android`'s own
# module documentation is what describes that request. Do not conflate the two;
# an earlier revision of this comment cited `dashscene-validator`, which
# contains no such prose.
#
# It exists because GPU time is otherwise unmeasurable on a retail Android
# device: `perfetto --query` registers no `gpu.counters` there, the `kgsl`
# ftrace tracepoints will not enable under `traced_probes`, and
# `/sys/class/kgsl` is refused to `shell` with no root. Timestamps are what is
# left, and the Adreno 620's Vulkan adapter reports all four query features.
#
# `dashscene-gpu --example gpu_time` is the consumer, and the only one — which
# is why `just lint` compiles this feature explicitly. A feature nothing builds
# rots.
gpu-timing = []

# `gpu_time` calls `Renderer::last_gpu_time`, which exists only under the
# feature above. Without this, `cargo test --no-run --workspace` and
# `clippy --all-targets` both build the example with default features and fail
# on the missing method — which is how the omission was found, by `just build`
# rather than by the two single-crate checks that preceded it.
[[example]]
name = "gpu_time"
required-features = ["gpu-timing"]

[dependencies]
# Boundary B — the `Painter` trait this crate implements, and the only
# dependency it has until story #578 brings the instance buffer and `wgpu`
# itself. Deliberately not `wgpu` yet: this story reserves the name and
# compiles the seam, and a device-owning painter is #580's.
dashpaint.workspace = true
# The GPU API itself, from story #579: the shader library and the compute
# harness that checks its arithmetic both need a device. The painter still owns
# none — a device, a queue and the pipelines over them are story #580's — so
# this is here for the shaders and their conformance suite, not for drawing.
# The GPU API and the byte casts. Real dependencies since story #580: the
# painter owns a device, a pipeline and the buffers it uploads.
wgpu.workspace = true
bytemuck.workspace = true
# Atlas residency, from story #581: packing by shelf and evicting by recency.
etagere.workspace = true
lru.workspace = true
# The one decoder this painter links. Boundary B's encoded half is PNG, JPEG and
# GIF; `Painter::samples` declares that this painter takes PNG and neither of
# the other two, so only this crate is needed and `libjpeg`/`libgif` stay out of
# a build whose whole point is that it is lean (issue #718). Pure Rust, so the
# wasm target of story #587 needs nothing else.
png.workspace = true

# `wgpu`'s adapter and device requests are async and this painter's constructors
# are not, so the native ones block on them. `pollster` does that without an
# async runtime.
#
# Native only, and that is the guard rather than a convention: on a browser's
# main thread a blocking wait cannot succeed, because the promise it waits on
# only resolves by returning to the JS event loop it is holding. Keeping
# `pollster` off the wasm target turns that deadlock into a compile error, so
# `cargo build --target wasm32-unknown-unknown` is what enforces it (story
# #587).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster.workspace = true

# The canvas type `SurfaceRenderer::for_canvas` takes. `wgpu` has a blanket
# conversion into `SurfaceTarget` for anything window-shaped and none for a
# canvas, so the wrapping has to happen somewhere; it happens here, so that a
# web host names no `wgpu` type — the same property `demo` holds natively.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { workspace = true, features = ["HtmlCanvasElement"] }

# Telling the window server that the swapchain holds sRGB, which macOS does not
# assume on its own (issue #746). Reached only by
# `SurfaceRenderer::match_layer_to_srgb`, which documents why; every other target
# links nothing new, and the offscreen `Renderer` links nothing new anywhere.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-graphics.workspace = true
