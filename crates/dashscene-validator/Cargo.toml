[package]
name = "dashscene-validator"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Shared validation crate: paint-vocabulary profiles, diagnostics, waivers (docs/specification/02-principles.md P4, docs/design/architecture.md)."

[lib]
name = "dashscene_validator"

# The validator sits beside the semantic model, not inside it: it reads the
# document (dashbuf) and boundary B (dashpaint), and producers call it. It
# deliberately does not depend on dashscene-core — core is published earlier
# (see the workspace publish order), so core cannot call the validator, and
# it does not need to: `CommittedScene`'s accessors already hand out
# dashpaint types.
[dependencies]
dashbuf.workspace = true
dashpaint.workspace = true
flatbuffers.workspace = true
