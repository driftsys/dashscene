[package]
name = "dashc"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Compiler CLI: Figma importer orchestration target, Figma-to-SCD lowering, diagnostics, .dsb emission. Also builds to wasm32-unknown-unknown for the Deno importer (DESIGN_1.md §4, §6.1)."

[lib]
# Named distinctly from the `dashc` bin target below: both compile to a
# same-named output file (dashc.wasm) on wasm32-unknown-unknown, which
# cargo flags as a filename collision. rlib for native use, cdylib so this
# crate can be built for wasm32-unknown-unknown and loaded directly by the
# Deno importer (SCOPE_DECISIONS.md §4).
name = "dashc_wasm"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "dashc"
path = "src/main.rs"

[dependencies]
dashbuf.workspace = true
dashpaint.workspace = true
dashscene-validator.workspace = true
flatbuffers.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
dashscene-core.workspace = true
dashscene-skia.workspace = true
