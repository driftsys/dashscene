[package]
name = "dashc"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Compiler CLI: Figma importer orchestration target, Figma-to-dashscene lowering, diagnostics, .dsb emission. Also builds to wasm32-unknown-unknown for the Deno importer (docs/design/architecture.md, docs/design/dashc.md)."

[lib]
# Named distinctly from the `dashc` bin target below: both compile to a
# same-named output file (dashc.wasm) on wasm32-unknown-unknown, which
# cargo flags as a filename collision. rlib for native use, cdylib so this
# crate can be built for wasm32-unknown-unknown and loaded directly by the
# Deno importer (docs/decisions/figma-importer-deno-plus-dashc-wasm.md).
name = "dashc_wasm"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "dashc"
path = "src/main.rs"

[dependencies]
dashbuf.workspace = true
dashpaint.workspace = true
dashscene-validator.workspace = true
# Pure-Rust MSDF generator for the Figma VECTOR field bake (story B1,
# docs/wip/2026-07-19-B1-vector-msdf-design.md). Pinned exactly: the
# generated field is welded per-texel to a committed pinned-msdfgen
# reference (tests/vector_field_weld.rs), so an fdsm bump must arrive as a
# deliberate, re-welded change (the same posture as the glyph atlas tool
# pin). Built into dashc.wasm, so it must stay wasm32-clean — no C/C++, no
# threads (verified by `just wasm`).
fdsm = { version = "=0.8.0", default-features = false }
# fdsm's public API takes and returns nalgebra points and affine transforms;
# the version tracks fdsm's own (0.34) so the point/transform types unify.
nalgebra = "0.34"
# fdsm writes fields into `image::RgbImage`; the `png` feature (only) encodes
# the packed atlas into `Document.images` and decodes the weld reference.
# default-features off keeps the colour-management subtree (moxcms, pxfm) and
# the other codecs out of dashc.wasm.
image = { version = "0.25", default-features = false, features = ["png"] }
flatbuffers.workspace = true
serde.workspace = true
# `unbounded_depth` enables `Deserializer::disable_recursion_limit`, which
# `figma::parse_file` pairs with its own linear depth pre-scan — see
# `figma::MAX_JSON_DEPTH` (debt #148).
serde_json = { workspace = true, features = ["unbounded_depth"] }

[dev-dependencies]
dashscene-core.workspace = true
dashscene-engine.workspace = true
dashscene-skia.workspace = true
# The story #167 acceptance ("a scene authored in Figma and the same
# scene authored in dashlang emit the same binding rows") compares the
# arena tables both producers stage — see tests/bindings_lowering.rs.
dashlang.workspace = true
