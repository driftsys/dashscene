[workspace]
resolver = "3"
members = [
  "crates/dashscene",
  "crates/dashscene-core",
  "crates/dashscene-engine",
  "crates/dashscene-typeset",
  "crates/dashscene-validator",
  "crates/dashpaint",
  "crates/dashscene-skia",
  "crates/dashcue",
  "crates/dashlang",
  "crates/dashbuf",
  "crates/dashc",
  "crates/dashpack",
  "crates/dashpack-astcenc-sys",
  "crates/dashscene-unity",
  "crates/dashscene-web",
  "crates/dashscene-desktop",
  "crates/dashscene-ffi",
  "crates/dashscene-android",
  "crates/dashscene-gpu",
  "goldens/tooling",
  # The showcase scenes the demonstration draws (v0.14, story #574). Under
  # `corpus/` rather than `demo/` because they exercise the full v0 paint
  # vocabulary, which is what the stress corpus is for; `demo/` holds the host.
  # `publish = false`, like `goldens/tooling` and `demo`, so it is outside
  # `docs/decisions/crate-name-map.md`.
  "corpus/showcase",
  # The windowed showcase host (v0.14, epic #568). A workspace member and not a
  # sixteenth published crate, following `goldens/tooling`: it carries
  # `publish = false`, it is absent from the justfile's `publish` recipe, and it
  # is therefore outside `docs/decisions/crate-name-map.md`.
  "demo",
  # The browser showcase host (v0.15, story #587). A second host rather than a
  # `cfg` arm inside `demo`: that crate depends on `skia-safe` and `softbuffer`,
  # neither of which builds for `wasm32-unknown-unknown`, so sharing one crate
  # would mean a `cfg` on every dependency line to reach a build with no Skia
  # painter in it at all. `publish = false`, like `demo`.
  "demo-web",
  # The Android showcase host (v0.19, story #842). A third demonstration host
  # beside `demo` and `demo-web`, `publish = false` like both, and therefore
  # outside `docs/decisions/crate-name-map.md`.
  "demo-android",
  # The smallest browser embedder that draws a `.dsb` (issue #776, story #795).
  # `publish = false`, and outside `crates/` deliberately: it is an artifact to
  # weigh rather than a crate anyone depends on, and putting it under `crates/`
  # would oblige it to appear in the publish registries
  # (`demo/tests/registry_consistency.rs`).
  "measure/web-minimal",
]

[workspace.package]
# **The one version, inherited by every crate.** Together-versioning was ruled
# on issue #795, and this is what makes it structural rather than a habit: a
# crate cannot hold a version of its own to drift, because it does not hold one
# at all. It also collapses `.git-std.toml`'s `[[version_files]]` for the crates
# from one entry each to this single line.
#
# `0.0.0` is a placeholder and not a release. The first real version is
# **0.2.0** (issue #795), because every one of the 17 names is reserved on
# crates.io at 0.1.0 and the whole workspace moves as one, so the first real
# release has to clear the entire 0.1.x band.
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/driftsys/dashscene"
# Bumped from 1.85 for story B1's `fdsm` MSDF tree (nalgebra 0.34, image 0.25),
# whose editions/APIs require a newer floor; 1.85 was inaccurate once the
# vector-field generator landed (dashc, B1.1).
rust-version = "1.88"

# path + version for every internal crate, per house style (docs/decisions/house-style.md).
# Publish order (see justfile `publish` recipe):
#   dashbuf -> dashpaint -> dashscene-core -> dashscene-typeset ->
#   dashcue -> dashscene-engine -> dashscene-validator -> dashscene-skia -> dashlang ->
#   dashc -> dashpack-astcenc-sys -> dashpack -> dashscene-unity ->
#   dashscene-gpu -> dashscene-desktop -> dashscene-web -> dashscene-ffi ->
#   dashscene-android -> dashscene
# dashscene-android follows dashscene-ffi, which it depends on: it is the
# first host to sit on the C ABI rather than beside it (story #841, D2).
# dashscene-gpu precedes both integration crates: story #741 made the web crate
# the integration surface over that painter and story #794 did the same for the
# desktop one, so both depend on it. The order was the other way round while
# dashscene-web was an empty placeholder — which is the trap here, since adding
# a dependency can invert an order that was correct when the crate was empty.
# Check it topologically against `cargo metadata`, over every crate rather than
# the one that changed.
# dashcue precedes dashscene-engine: the engine's FLIP (story #22) consumes it.
# dashpack follows dashc: it will compile against dashbuf's asset and manifest
# schemas, and nothing in the workspace depends on it (epic #345).
# dashpack-astcenc-sys precedes dashpack, which links it (story #430). Both are
# in the `publish` recipe and in every other registry that enumerates crates;
# the sentence here used to say otherwise, describing the state issue #445 was
# filed in and never updated when that half was fixed. A comment asserting a gap
# that has been closed is how the next audit is told not to look (issue #795).
[workspace.dependencies]
dashscene = { path = "crates/dashscene", version = "0.0.0" }
dashscene-core = { path = "crates/dashscene-core", version = "0.0.0" }
dashscene-engine = { path = "crates/dashscene-engine", version = "0.0.0" }
dashscene-typeset = { path = "crates/dashscene-typeset", version = "0.0.0" }
dashscene-validator = { path = "crates/dashscene-validator", version = "0.0.0" }
dashpaint = { path = "crates/dashpaint", version = "0.0.0" }
dashscene-skia = { path = "crates/dashscene-skia", version = "0.0.0" }
dashcue = { path = "crates/dashcue", version = "0.0.0" }
dashlang = { path = "crates/dashlang", version = "0.0.0" }
dashbuf = { path = "crates/dashbuf", version = "0.0.0" }
dashc = { path = "crates/dashc", version = "0.0.0" }
dashpack = { path = "crates/dashpack", version = "0.0.0" }
dashpack-astcenc-sys = { path = "crates/dashpack-astcenc-sys", version = "0.0.0" }
dashscene-unity = { path = "crates/dashscene-unity", version = "0.0.0" }
dashscene-web = { path = "crates/dashscene-web", version = "0.0.0" }
dashscene-desktop = { path = "crates/dashscene-desktop", version = "0.0.0" }
dashscene-ffi = { path = "crates/dashscene-ffi", version = "0.0.0" }
dashscene-android = { path = "crates/dashscene-android", version = "0.0.0" }
dashscene-gpu = { path = "crates/dashscene-gpu", version = "0.0.0" }

# Stack per docs/design/architecture.md — reserved here for crates to opt into as
# implementation lands; not every crate depends on every entry.
taffy = { version = "0.12", default-features = false, features = [
    "std",
    "taffy_tree",
    "flexbox",
    "block_layout",
    "grid",
] }
rustybuzz = "0.20"
# Retained paint/clip interners and the solver's per-node caches key on
# colour/geometry bits, which need neither SipHash's DoS resistance nor its
# cost (docs/decisions/ ... incremental commit). FxHashMap is the fast,
# deterministic replacement.
rustc-hash = "2"
unicode-bidi = "0.3"
# General-category lookup for the font-fallback cascade: combining marks
# (Mn/Mc/Me) and format controls (Cf, e.g. ZWJ/ZWNJ) must route with the
# base they attach to, not on their own coverage. Already in the tree via
# rustybuzz, so no new transitive weight.
unicode-properties = { version = "0.1", default-features = false, features = [
    "general-category",
] }
ttf-parser = "0.25"
# Pinned to the exact flatc release (installed via `brew install
# flatbuffers` / `apt-get install flatbuffers-compiler`, or downloaded
# from github.com/google/flatbuffers/releases) — the generated Rust API
# can change between flatc majors, so compiler and runtime crate must
# match.
flatbuffers = "=25.12.19"
# The .dsb container's content hash (docs/design/dsb-container-format.md).
# BLAKE3 rather than SHA-256 for the reason the asset-model decision named when
# it left the algorithm open: its tree structure gives chunk-level verified
# streaming when the remote asset channel lands (v2). Default features only —
# `rayon` and `mmap` stay off so the portable implementation builds for
# wasm32-unknown-unknown, which dashc requires.
blake3 = "1"
# The memory mapping R5 names in the requirement text itself: "cold-start cost
# proportional to what is shown, not to file size (mmap + section discipline)"
# (story #595, epic #594). Held by `dashbuf::map`, and target-gated there rather
# than here: wasm has no mapping, which is why story #587's prefix reader exists.
#
# This is unrelated to `blake3`'s own `mmap` feature above, which stays off.
memmap2 = "0.9"
lyon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
tempfile = "3"
# Build-script driver for the vendored astcenc C++ sources
# (crates/dashpack-astcenc-sys/build.rs, story #430). Already in the tree via
# skia-bindings, so no new transitive weight.
cc = "1"
# Zstd supercompression for the KTX2 level payloads (dashpack, story #431).
# Default features off: `legacy` (decoding pre-0.8 zstd streams) and
# `zdict_builder` (dictionary training) are both unreachable from the packer.
# libzstd is compiled from the vendored C sources rather than linked from
# whatever the build machine has installed, because the `pkg-config` feature
# that would link a system library is opt-in and stays unselected — that is
# zstd-sys's default, not something turning defaults off achieves.
#
# Reproducibility measured rather than assumed, the way story #430 established
# for astcenc: the same payloads compressed by aarch64-apple-darwin and
# x86_64-apple-darwin builds of this exact zstd-sys produced byte-identical
# output at levels 3 and 19, for both an uncompressed-texel payload and an
# incompressible block payload. `Cargo.lock` is what pins the version that
# result belongs to.
zstd = { version = "0.13", default-features = false }
# An independently written KTX2 parser. `dashpack` takes it as a
# dev-dependency only: it reads back what dashpack's own writer emits, and
# never appears on the emit path (story #431).
ktx2 = "0.5"
# Pure-Rust PNG decoding, the image-rs family member the asset-pipeline plan
# names for the packer's canonical-to-RGBA step. `dashpack` takes it as a
# dev-dependency only for now: the band contracts are measured on the committed
# corpus PNGs, while `dashpack::profile` itself takes decoded texels (#432).
# Already in the tree through `image`, so no new transitive weight.
png = "0.18"
# The two published perceptual scales the quality profiles are calibrated
# against (issue #544). Test tooling only: `goldens` takes both, `goldens` is
# `publish = false`, and nothing in a shipped crate reaches either.
#
# SSIMULACRA2 is the JPEG XL project's still-image metric, on a published
# scale — roughly 90 and above visually lossless, 70 and above high quality.
# This is the rust-av port rather than a binding to libjxl, so it needs no C++
# toolchain and no vendored tree.
ssimulacra2 = "0.5"
# FLIP is NVIDIA's metric for comparing *rendered* images: it models what a
# viewer notices alternating between two of them. Half the target content is 3D
# renders (docs/wip/2026-07-28-photorealistic-3d-content.md), which makes it the
# matched metric rather than a generic one. The crate vendors the CPU
# implementation inside its own `-sys` package, so it is an ordinary dependency
# and not a vendored tree NOTICE has to cover.
nv-flip = "0.1"
# The GPU API the lean painter is built on (epic #569,
# `docs/decisions/wgpu-is-the-lean-painter.md`). 30.0.0 is the version the
# direction note pinned and is still current; it carries a silent WGSL break
# from 29 — integer shader I/O no longer defaults to `@interpolate(flat)` and
# must say so — which matters to every shader this workspace writes.
wgpu = "30.0"
# Casting the instance rows and the conformance buffers to bytes. `wgpu`
# depends on it already, so this pins the version the workspace shares rather
# than adding a dependency.
bytemuck = { version = "1.25", features = ["derive"] }
# `wgpu`'s device and buffer APIs are async, and the layer-2 conformance suite
# is an ordinary synchronous test. `pollster` blocks on a future without
# pulling in an async runtime, which is what every wgpu example uses for this.
pollster = "1.0"
# Naming one Core Graphics colour space, so the lean painter can tell macOS that
# its swapchain holds sRGB and have the window server colour match it to the
# display (issue #746). `wgpu-hal` already depends on this exact version for the
# same layer, so this pins the version the workspace shares rather than adding a
# second: two versions would be two `CGColorSpace` types and `setColorspace`
# would not take ours.
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
  "std",
  "CGColorSpace",
] }
# Texture-atlas allocation for the lean painter's residency (story #581).
# `glyphon` pairs `etagere` with `lru` for exactly this — dynamic packing plus
# eviction — which is the pairing epic #569's direction note picked.
#
# The shelf allocator rather than `BucketedAtlasAllocator`, which is what
# `glyphon` itself uses: buckets are quantised in height and are the right
# trade when every allocation is a glyph. This atlas also holds image fills,
# whose sizes span two orders of magnitude, and a bucketed allocator wastes the
# quantisation on each of them.
etagere = "0.3"
# The eviction half of the pair above. A residency set needs a recency order to
# choose a victim by, and writing one is writing an intrusive linked list.
lru = "0.18"
# Pinned exactly: golden images are bit-exact only for one exact skia
# build (goldens/README.md); a patch release changing rasterization or
# PNG encoding must arrive as a deliberate, re-goldened bump.
skia-safe = "=0.81.0"
# The window and its event loop, for the showcase host (`demo/`, story #571).
# 0.30 rather than 0.31: 0.31 is published only as `0.31.0-beta.1` and
# `0.31.0-beta.2`, and it renames the whole `ApplicationHandler` surface
# (`resumed` to `can_create_surfaces`, `Window` to `Box<dyn Window>`,
# `WindowEvent::Resized` to `SurfaceResized`). A pre-release is not something to
# pin a first windowed target to; 0.30.13 is the current stable line.
#
# Default features, kept rather than trimmed: `x11`, `wayland`,
# `wayland-dlopen` and `wayland-csd-adwaita`. The first three matter because
# both Linux backends load their client libraries at run time rather than
# linking them, so `cargo build -p demo` needs no X11 or Wayland development
# package on a headless runner; the fourth is what draws a titlebar on a
# Wayland compositor that expects the client to draw its own.
winit = "0.30"
# The CPU blit path: `softbuffer` hands back a window-sized framebuffer and
# posts it. It is the same rust-windowing project as `winit`, and 0.4 speaks
# `raw-window-handle` 0.6, which is the version winit 0.30 exposes.
#
# This is what lets the Skia reference painter reach a window without a GL
# context, Ganesh, or a `skia_use_gl` build: skia rasters to CPU memory, and
# this posts CPU memory to a window. Default features are `x11`, `wayland` and
# `kms`, all three dlopen or pure Rust, so the headless-build property above
# holds here too.
softbuffer = "0.4"
# The browser bindings the web host is written against (story #587). Every one
# of these versions is the one `wgpu` already resolves on `wasm32-unknown-
# unknown`, so declaring them here pins what the workspace was already building
# rather than introducing a second resolution of the same crates.
#
# `wasm-bindgen`'s version has to match the `wasm-bindgen-cli` that post-
# processes the module — the two halves of one ABI, and a mismatch is a run-time
# failure in the browser rather than a build error. `bootstrap` does **not**
# install it — it builds from source in minutes and only this demonstration
# needs it — so `just web-build` checks the pair and prints the exact install
# command instead.
# Android, and only reachable from `dashscene-android`, whose manifest gates
# both behind `cfg(target_os = "android")`. Already resolved in the tree
# through wgpu's Android backend, so these name a version rather than add a
# build.
ndk-sys = "0.6.0"
jni = "0.22.4"

wasm-bindgen = "0.2.126"
wasm-bindgen-futures = "0.4.76"
js-sys = "0.3.103"
# Feature-gated to what the host names, which is the convention `web-sys` is
# built around: it is one crate covering the whole web platform and compiles
# only the bindings asked for.
web-sys = { version = "0.3.103", features = [
  "Document",
  "DomRect",
  "Element",
  "Headers",
  "HtmlCanvasElement",
  "Location",
  "Performance",
  "Request",
  "RequestInit",
  "Response",
  "Window",
  "console",
] }

[profile.release]
lto = true
strip = true
codegen-units = 1

# The vendored astcenc is C++ compiled by a build script, and `cc` takes its
# optimisation level from the cargo profile of the package it is building. Left
# at the dev profile's `opt-level = 0` the encoder runs about eighty times
# slower than at release — measured at 597 s against 7.5 s for one band sweep —
# which is the difference between `cargo test` taking seconds and taking ten
# minutes, because `just test` builds the workspace at the dev profile.
#
# Optimising this one package under the dev profile costs nothing in
# debuggability: the Rust side of the -sys crate is a generated FFI shim with no
# logic to step through, and the C++ is vendored third-party source. It changes
# no output: `crates/dashpack/tests/band_contract.rs` pins the exact measured
# differing fractions, and both `cargo test` and `cargo test --release` have to
# reproduce them, so a build-profile-dependent encoder would fail the suite.
[profile.dev.package.dashpack-astcenc-sys]
opt-level = 3
