[workspace]
resolver = "3"
members = [
  "crates/dashscene",
  "crates/dashscene-core",
  "crates/dashscene-engine",
  "crates/dashscene-typeset",
  "crates/dashscene-validator",
  "crates/dashpaint",
  "crates/dashscene-skia",
  "crates/dashcue",
  "crates/dashlang",
  "crates/dashbuf",
  "crates/dashc",
  "crates/dashscene-unity",
  "crates/dashscene-web",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/driftsys/dashscene-staging"
rust-version = "1.85"

# path + version for every internal crate, per house style (SCOPE_DECISIONS.md §7).
# Publish order (see justfile `publish` recipe):
#   dashbuf -> dashscene-core -> dashscene-typeset -> dashscene-engine ->
#   dashscene-validator -> dashpaint -> dashscene-skia -> dashcue -> dashlang ->
#   dashc -> dashscene-unity -> dashscene-web -> dashscene
[workspace.dependencies]
dashscene = { path = "crates/dashscene", version = "0.0.0" }
dashscene-core = { path = "crates/dashscene-core", version = "0.0.0" }
dashscene-engine = { path = "crates/dashscene-engine", version = "0.0.0" }
dashscene-typeset = { path = "crates/dashscene-typeset", version = "0.0.0" }
dashscene-validator = { path = "crates/dashscene-validator", version = "0.0.0" }
dashpaint = { path = "crates/dashpaint", version = "0.0.0" }
dashscene-skia = { path = "crates/dashscene-skia", version = "0.0.0" }
dashcue = { path = "crates/dashcue", version = "0.0.0" }
dashlang = { path = "crates/dashlang", version = "0.0.0" }
dashbuf = { path = "crates/dashbuf", version = "0.0.0" }
dashc = { path = "crates/dashc", version = "0.0.0" }
dashscene-unity = { path = "crates/dashscene-unity", version = "0.0.0" }
dashscene-web = { path = "crates/dashscene-web", version = "0.0.0" }

# Stack per DESIGN_1.md §2 — reserved here for crates to opt into as
# implementation lands; not every crate depends on every entry.
taffy = "0.7"
rustybuzz = "0.20"
unicode-bidi = "0.3"
ttf-parser = "0.25"
# Pinned to the exact flatc release (installed via `brew install
# flatbuffers` / `apt-get install flatbuffers-compiler`, or downloaded
# from github.com/google/flatbuffers/releases) — the generated Rust API
# can change between flatc majors, so compiler and runtime crate must
# match.
flatbuffers = "=25.12.19"
lyon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
tempfile = "3"
skia-safe = "0.81"

[profile.release]
lto = true
strip = true
codegen-units = 1
