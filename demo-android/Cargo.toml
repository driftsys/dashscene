[package]
name = "demo-android"
version = "0.0.0"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The Android showcase host: a SurfaceView, the native vsync loop, and the showcase scenes with the frame-timing instrument (v0.19, story #842)."

# A cdylib, which is what `System.loadLibrary` loads. `rlib` alongside it so the
# scene selection stays reachable from ordinary `cargo test` on the host
# platform — it is the one thing here that can be wrong without a device.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The scenes. `publish = false` in both directions: a demonstration host may
# depend on a demonstration corpus, and neither is a published crate. Not gated,
# because `select()` is the one thing here that can be wrong without a device
# and is tested on the host.
showcase = { path = "../corpus/showcase" }

[target.'cfg(target_os = "android")'.dependencies]
# Everything below is reached only from `src/host.rs`, which is gated on this
# target. Off Android this crate is `select()` and the timing arithmetic, and a
# host build that resolved wgpu to run three tests over them would be paying for
# nothing — the same reason `dashscene-android` keeps `ndk-sys` and `jni` out of
# its own host build.
#
# The Android integration surface: the render thread, the vsync loop and the
# destroy handshake. This host implements `Frames` and consumes the rest, which
# is the point — a second frame loop written beside the first is the divergence
# story #834 exists to prevent.
dashscene-android.workspace = true
# The lean painter and its `ANativeWindow` surface. Taken directly rather than
# through the C ABI, because a scene built in code needs an `Arena` and the
# ABI's arena lives inside an opaque `DsRuntime`; a builder entry point is
# layer 2 (D8) and is deferred with its layer.
dashscene-gpu.workspace = true
# Boundary B — the `Painter` trait this host drives.
dashpaint.workspace = true
# The arena and `CommittedScene`, the committed buffer a painter is handed.
dashscene-core.workspace = true
# `LiveScene`, the type the frame loop ticks, and the owner of the frame-delta
# clamp and the generation gate this host reads rather than restates.
dashlang.workspace = true
# The JNI entry points the Kotlin side binds to.
jni.workspace = true
# `ANativeWindow_fromSurface` and the log, on the one target that has them.
ndk-sys.workspace = true
