[package]
name = "demo"
version = "0.0.0"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The showcase host: a window, a presentation seam, and the Skia blit behind it (v0.14, epic #568)."

[dependencies]
# Boundary B — the `Painter` trait the presenter drives.
dashpaint.workspace = true
# `CommittedScene`, the committed buffer a presenter is handed.
dashscene-core.workspace = true
# The v0 reference painter, behind one of the two `Present` implementations.
dashscene-skia.workspace = true
# The lean painter, behind the other (story #585). It brings its own surface,
# so this host names no `wgpu` type and takes no `wgpu` dependency — see
# `crates/dashscene-gpu/src/surface.rs` for why the surface sits there.
dashscene-gpu.workspace = true
# `LiveScene`, the type the frame loop ticks and the scenes hand back.
dashlang.workspace = true
# The showcase scenes themselves (story #574). A workspace member under
# `corpus/`, not a published crate: the host holds the loop, the corpus holds
# the content. Each scene injects its own solver.
showcase = { path = "../corpus/showcase" }
# The product layout solver. `document.rs` (story #575) injects one for the
# loaded document, which has no scene builder of its own to do it.
dashscene-engine.workspace = true
# The `.dsb` envelope reader (story #575): `dashbuf::open` for the compiled
# document `document.rs` loads.
dashbuf.workspace = true
# The load gate `document.rs` runs before `dashscene_core::load_document`
# (story #575).
dashscene-validator.workspace = true
winit.workspace = true
softbuffer.workspace = true
