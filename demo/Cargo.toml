[package]
name = "demo"
version = "0.0.0"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The showcase host: a window, a presentation seam, and the Skia blit behind it (v0.14, epic #568)."

[dependencies]
# The desktop integration surface: the window, the frame loop, the generation
# gate, rebuilding on resize, the `Present` seam and the `.dsb` load (story
# #794). This is a demonstration of that crate, and consuming it rather than
# restating it is the point — an embedder writes what is left here, and no more.
dashscene-desktop.workspace = true
# Boundary B — the `Painter` trait the Skia presenter drives.
dashpaint.workspace = true
# `CommittedScene`, the committed buffer a presenter is handed.
dashscene-core.workspace = true
# The v0 reference painter, behind this crate's own `Present` implementation.
# It stays here rather than in the integration crate because `skia-safe` is a
# vendored C++ build and a `winit` embedder must not resolve it to open a
# window — issue #794's ruling, and `present.rs` records it.
dashscene-skia.workspace = true
# `LiveScene`, the type the scenes hand back and the scripted pulse writes into.
dashlang.workspace = true
# The showcase scenes themselves (story #574). A workspace member under
# `corpus/`, not a published crate: this holds the demonstration, the corpus
# holds the content. Each scene injects its own solver.
showcase = { path = "../corpus/showcase" }
# The window type the presenter binds to, and the events the input mapping
# reads. `dashscene-desktop` owns the loop; this names the same `winit` types it
# hands over.
winit.workspace = true
# The CPU blit the Skia presenter posts through.
softbuffer.workspace = true
