[dev-dependencies]
# The reference painter, for the `still` example only: it renders one scene to
# a PNG for the entry-path documentation. A dev-dependency rather than a plain
# one so the library the host links carries no painter of its own — a scene
# describes what to draw and never how.
dashscene-skia.workspace = true
