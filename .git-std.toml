#:schema https://driftsys.github.io/git-std/schemas/v1/git-std.schema.json
# git-std configuration for dashscene-staging.
# See docs/decisions/house-style.md — dogfoods git-std's own conventions.

scheme = "semver"
# Explicit rather than "auto" (which only discovers crates/*): "auto"
# leaves no valid scope for repo-wide commits (docs, CI, hooks, deps).
# Keep in sync with crates/ when adding/removing a crate.
#
# A scope earns its place by making the changelog or a `git log --grep`
# more useful. One scope per top-level directory would dilute them, so
# the non-crate scopes are deliberate rather than exhaustive:
#
#   goldens     goldens/     the golden images and their diff tooling
#   corpus      corpus/      the stress corpus — captured Figma JSON,
#                            fonts, glyph atlases, photographic payloads,
#                            the DSL-generated stress cases, and the
#                            showcase scenes the demonstration draws
#                            (corpus/showcase/, a workspace member added
#                            by story #574). Mostly data; the capture tool
#                            is code but lives under importers/, so it
#                            takes that scope instead.
#   importers   importers/   the Deno/TypeScript Figma importer and its
#                            capture tool, which have their own
#                            toolchain and their own CI job
#   measure     measure/     artifacts that exist to be weighed rather than
#                            run — the minimal browser embedder the runtime
#                            payload budget is measured over (issue #776)
#   demo        demo/        the windowed showcase host — a workspace
#                            member with its own binary and its own CI
#                            job, not a published crate (story #571).
#                            Covers demo-web/ too, the browser host added
#                            by story #587: one scope for the hosts, as
#                            `corpus` covers corpus/showcase and `goldens`
#                            covers goldens/tooling
#
scopes = [
    "dashscene",
    "dashscene-core",
    "dashscene-engine",
    "dashscene-typeset",
    "dashscene-validator",
    "dashpaint",
    "dashscene-skia",
    "dashcue",
    "dashlang",
    "dashbuf",
    "dashc",
    "dashpack",
    "dashpack-astcenc-sys",
    "dashscene-unity",
    "dashscene-web",
    "dashscene-desktop",
    "dashscene-gpu",
    "dashscene-ffi",
    "dashscene-android",
    "goldens",
    "corpus",
    "importers",
    "demo",
    "measure",
    "repo",
    "docs",
    "ci",
    "hooks",
    "deps",
    "release",
]
strict = true
types = [
    "feat",
    "fix",
    "docs",
    "style",
    "refactor",
    "perf",
    "test",
    "chore",
    "ci",
    "build",
    "revert",
]

# **What `git std bump` rewrites.** Together-versioning was ruled on issue #795,
# and it *is* this list: a crate the list omits does not move, which is exactly
# what issue #445 predicted and what happened to `dashpack` and
# `dashpack-astcenc-sys` — absent here until this story while present in every
# other registry.
#
# Two kinds of entry, and the split is the point.
#
# **The crates need no entry here.** They inherit `version.workspace = true`
# from the root `[workspace.package]`, and git-std's builtin Cargo handling
# already moves that key — section-scoped, and correctly skipping the dotted
# `version.workspace = true` in each crate.
#
# An unanchored `regex = 'version = "([^"]+)"'` entry was written here first and
# removed on review. It was redundant, and worse than redundant: its only
# property was "the first `version = ` in the whole file", with none of the
# builtin's section or key guards. Seven lines below the workspace version sits
# `rust-version = "1.88"`, so alphabetising `[workspace.package]` would have made
# a bump write `rust-version = "0.3.0"` — valid semver that every toolchain
# satisfies, so the MSRV floor would have gone with nothing red. Demonstrated by
# running it, not argued.
#
# **One entry per internal dependency requirement**, each anchored on its own
# crate name. That verbosity is not a style choice — git-std's `write_version`
# calls `.captures()` and splices exactly **one** span per entry
# (`crates/standard-version/src/regex_engine.rs`), so a single unanchored entry
# against this file would move one requirement and leave the rest at `^0.0.0`.
# That is worse than no entry at all: every crate with an internal dependency
# would be broken on first publish, and the registry would look covered.
# Verified by running `git std bump` and reading all 18 resulting values, not by
# reading this config (issue #795).
[[version_files]]
path = "Cargo.toml"
regex = 'dashbuf = \{ path = "crates/dashbuf", version = "([^"]+)"'

[[version_files]]
path = "Cargo.toml"
regex = 'dashc = \{ path = "crates/dashc", version = "([^"]+)"'

[[version_files]]
path = "Cargo.toml"
regex = 'dashcue = \{ path = "crates/dashcue", version = "([^"]+)"'

