[package]
name = "goldens"
version = "0.0.0"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Golden-image harness: renders scenes through the reference painter and compares them against checked-in PNGs (docs/design/architecture.md, docs/roadmap.md v0.1)."

[dependencies]
skia-safe.workspace = true

[dev-dependencies]
dashlang.workspace = true
tempfile.workspace = true
dashcue.workspace = true
dashpaint.workspace = true
dashscene-core.workspace = true
dashscene-engine.workspace = true
dashscene-skia.workspace = true
dashscene-typeset.workspace = true
# The v0.7 text-lowering golden (#160) drives the whole importer chain:
# `dashc` lowers a captured Figma fixture (under a `dashscene-validator`
# profile) and `dashbuf` parses the emitted `.dsb` before `dashscene-core`
# loads it.
dashbuf.workspace = true
dashc.workspace = true
dashscene-validator.workspace = true
# The v0.7 ellipse golden (#239) derives the captured negative-gap fixture in
# place (lifting the root's HUG width, retyping ellipses to frames for the
# sensitivity guard).
serde_json.workspace = true
