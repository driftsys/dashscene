[package]
name = "goldens"
version = "0.0.0"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Golden-image harness: renders scenes through the reference painter and compares them against checked-in PNGs (docs/design/architecture.md, docs/roadmap.md v0.1)."

[features]
# The Gfx QA profile preview (story #435): `goldens::profile` derives a
# document under HiFi or Lite, and `goldens::render` software-decodes the
# resulting block payloads so the reference painter can draw them. On by
# default, so `cargo test --workspace` and `cargo clippy --all-targets` cover
# it. A build with it off still loads and renders RAW; it refuses a block
# payload by name rather than drawing it wrongly.
default = ["profile-preview"]
profile-preview = ["dep:dashpack"]

[dependencies]
skia-safe.workspace = true
# The two published perceptual scales the profile bands are calibrated against
# (issue #544). Real dependencies rather than dev-only because `src/metric.rs`
# is a library module both test binaries reach; this crate is `publish = false`,
# so nothing shipped links either.
ssimulacra2.workspace = true
nv-flip.workspace = true
# render_dsb (src/render.rs) loads a committed `.dsb` and renders it through the
# full stack, so the render-pipeline crates are real dependencies now, not
# dev-only: dashbuf parses the buffer, dashscene-core loads it, dashscene-engine
# re-solves through the typesetter measure seam, dashscene-typeset shapes,
# dashpaint carries the boundary-B tables, dashscene-skia paints.
dashbuf.workspace = true
dashpaint.workspace = true
dashscene-core.workspace = true
dashscene-engine.workspace = true
dashscene-skia.workspace = true
dashscene-typeset.workspace = true
# The packer, and its `preview` feature — the block decoder the reference load
# path needs to draw a derived bank (story #435). A real dependency rather than
# a dev-dependency since `src/profile.rs` and `src/render.rs` reach it, and
# optional so a consumer that only ever renders RAW does not link a packer.
# It also still serves the two test-only uses it arrived for: the band-vocabulary
# weld (`tests/asset_band_weld.rs`, story #432) and the derived-bank golden
# (`tests/derived_bank.rs`, story #434).
dashpack = { workspace = true, features = ["preview"], optional = true }

[dev-dependencies]
dashlang.workspace = true
tempfile.workspace = true
# The weld test (`tests/profile_preview_weld.rs`) reads the block payload back
# out of an assembled `.dsb` with an independently written KTX2 parser and
# libzstd, rather than with an inverse of `dashpack`'s own writer: the leg that
# proves what ships is what the encoder made is worth more when someone else
# wrote the reader (story #435).
ktx2.workspace = true
zstd.workspace = true
# Decodes the committed corpus PNGs the derived-bank golden packs
# (`tests/derived_bank.rs`), through the same crate `dashpack`'s own band tests
# decode with: the golden is byte-exact over the encoder's output, so the
# encoder's input has to come from one decode path and not two (story #434).
png.workspace = true
dashcue.workspace = true
# The lean painter, for the baked-asset chain test (story #581). This is the
# only workspace member that depends on both `dashpack` and a GPU painter, and
# it is where that join is checked: `dashscene-gpu` must not depend on the
# packer, and the packer must not depend on a painter.
dashscene-gpu.workspace = true
# The showcase scenes, for the `painter-diff` example only: it draws the same
# committed frame through both painters offscreen so the two can be compared
# without either windowing path in the way. A dev-dependency, so nothing the
# harness itself links carries the demonstration's content.
showcase = { path = "../../corpus/showcase" }
# The render_dsb unit test and the v0.7 text-lowering golden (#160) drive
# `dashc`'s compile_figma to build a `.dsb` in-process; the `dashscene-validator`
# profile selects the compile profile. Both are test-only.
dashc.workspace = true
dashscene-validator.workspace = true
# serde_json builds the render_dsb unit test's inline Figma fixture and derives
# the v0.7 ellipse golden's (#239) captured negative-gap fixture in place.
serde_json.workspace = true
# The story-B1 vector-render test (v010_vector_render.rs) hand-builds a `.dsb`
# with a baked MSDF field to prove vectors render through the whole stack.
flatbuffers.workspace = true
