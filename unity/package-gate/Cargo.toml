[package]
name = "package-gate"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The Unity package's gates that need no Unity editor and no .NET SDK: the HLSL derivation of the WGSL shader library, the pragma rules over the shaders that consume it, R-E10's engine/engine-free split of Runtime/, R-E21's platform data over each shipped native library, and the prose the editor-only gates carry — R-E7/E8/E9's recorded status, `unity-android-negative`'s mutation table, and what `just unity-editor` claims to ask."
publish = false

[dependencies]
# The one dependency, and the reason this crate is Rust. `naga` is wgpu's own
# shader translator — the compiler the lean painter's WGSL already goes through
# on its way to Metal, Vulkan and GLES. Using it to reach HLSL is what makes
# R-T5's "single-sourced" a mechanism rather than a review promise: the HLSL a
# Unity shader includes is not a port of `sdf.wgsl`, it is `sdf.wgsl` compiled
# by the compiler that compiles it for the other painter.
#
# `hlsl-out` pulls no dependency of its own and `wgsl-in` pulls only
# `unicode-ident`, both already in the lockfile through wgpu.
naga = { version = "30", features = ["wgsl-in", "hlsl-out"] }

[dev-dependencies]
# `tests/order_fixture.rs` compiles `unity/render-gate/order.json` to the
# committed `order.dsb` the render gate draws, the way `crates/dashc`'s own
# tests pin `goldens/dsb/`. Dev-only: nothing the gate ships depends on the
# compiler, and the sanity tier already builds `dashc` for its own tests.
dashc.workspace = true
dashscene-validator.workspace = true
serde_json.workspace = true
