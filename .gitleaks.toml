# gitleaks configuration.
#
# The default rule set is kept in full and extended with the one credential
# class this repository handles that gitleaks does not carry.
#
# **There is exactly one allowlist here, and it excludes two paths.** See the
# block at the end of this file. Everything else is triaged in
# `.gitleaksignore` by per-finding fingerprint.
#
# No regex allowlist. An earlier revision used two and both over-matched:
# `[A-Z_]*FILE_[A-Z_]*KEY` also matches `PROFILE_`, exempting any
# `PROFILE_*_KEY` secret tree-wide, and an unscoped 40-hex `key:` pattern
# exempted every 40-hex secret written under a field of that name. A
# fingerprint cannot do that: it names one finding in one file at one line,
# and a finding that moves reappears for re-triage.
#
# Two cautions for whoever runs this next:
#
# - `gitleaks git --log-opts="--all"` reports `0 commits scanned` and emits
#   empty `.Commit` fields in 8.30.1. Both are reporting bugs, not a failed
#   scan. To tell a history finding from a working-tree one, scan a
#   `git archive HEAD` export separately with `gitleaks dir` and difference
#   the two reports.
# - gitleaks' defaults miss shapes this repository can contain. Measured on
#   2026-08-10 against planted credentials: `ghp_<36>` detected;
#   `figd_<40>` not detected (no rule existed — added below); a
#   correctly-shaped AWS access key ID not detected, in a bare assignment
#   or inside an `X-Amz-Credential=` URL. That last gap is why `just
#   secrets` runs a deterministic pattern grep as a second, independent
#   gate. Neither gate alone is sufficient.

title = "dashscene"

[extend]
useDefault = true

[[rules]]
id = "figma-pat"
description = "Figma personal access token"
regex = '''figd_[A-Za-z0-9_-]{20,}'''
keywords = ["figd_"]

# --- the triage records themselves -----------------------------------------
#
# `.secrets-triaged` and `.secrets-history-baseline` enumerate the values they
# triage, so gitleaks finds every one of them there. These are the only paths
# excluded anywhere in this configuration, and the exclusion is safe for a
# reason that holds for no other file: their entire content is, by definition,
# values already read and ruled on. Writing a value into one of them IS the act
# of triaging it.
#
# They were previously pinned in .gitleaksignore by fingerprint, and a
# fingerprint pins a line number. Both files are sorted, so triaging one new
# pair shifted up to 26 fingerprints and broke the tree gate — making the
# documented recovery from one gate the thing that breaks the other.
# THE TRADEOFF THIS ACCEPTS, stated rather than hidden: because gitleaks now
# never reads these two files, a real credential pasted into one of them is
# invisible to the gitleaks gates. What still catches it is the pattern grep,
# which reads the committed copy and does not exempt by path — and the fact
# that writing a value into a triage record is a reviewable diff whose whole
# purpose is to be read. The fingerprints this replaced forced a re-triage on
# any edit, which is stricter; they also broke the tree gate every time the
# sorted file gained a line, which is why they are gone.
[[allowlists]]
description = "the triage records, whose content is triaged values by construction"
paths = [
  '''\.secrets-triaged$''',
  '''\.secrets-history-baseline$''',
]
