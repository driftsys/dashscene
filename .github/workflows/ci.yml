name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue's batch. GitHub builds a temporary branch holding `main`
  # plus the queued pull requests and asks for the same `ci` check on it, so
  # this trigger is what makes the queue's answer exist at all: without it no
  # required check ever reports on a merge group, and every queued pull request
  # sits until it times out.
  #
  # The gates resolve from the batch's own range, not forced on. A merge group
  # carries `base_sha` and `head_sha` in its payload, and both the filter step
  # and the code detector below read them, so a documentation-only batch skips
  # the compile half here exactly as it does on the pull request. Forcing
  # instead would put `calibration`'s 272 s on the front of every merge.
  #
  # `convco` is the one job that does not run here. It is gated on
  # `pull_request`, and the aggregate accepts `skipped` — the commit messages
  # were linted on the pull request that entered the queue, and there is no
  # second author between there and here.
  #
  # HOW THIS BREAKS, accurately. A wrong field name in the expressions below
  # does NOT make the check silent: the expression yields an empty string,
  # `scripts/is-code-change` fails closed to `true`, and `ci` reports GREEN over
  # a degraded range. That is the likely defect, and it is loud in the wrong
  # direction rather than quiet — a green merge group is not by itself evidence
  # that these four expressions resolved.
  #
  # Only a narrower class stalls the queue instead: this trigger removed, the
  # workflow failing to parse on the queue's branch, or the aggregate `ci` job
  # renamed out from under the required check. Then no check ever reports and
  # every queued pull request times out rather than one failing. The way out is
  # to remove the `merge_queue` rule from ruleset 20731537 — restoring its seven
  # parameters from docs/decisions/review-before-ready-not-before-open.md, since
  # re-adding it bare restores GitHub's defaults — fix through an ordinary pull
  # request, and re-add the rule.
  merge_group:
  # Manual trigger: forces every path-filtered job, so the expensive shape can
  # be run without waiting for a diff that happens to schedule it.
  #
  # NOT because that shape is unreachable. `calibration` fires on the `packer`
  # filter and `deno` on `figma`, and ordinary work schedules them: the push of
  # #905's merge ran calibration in 272 s inside a 304 s wall clock. This is for
  # the case where waiting for the right diff is itself the problem — after
  # editing the filter lists, where the change under test is which jobs run.
  #
  # No inputs. A dispatch always forces. An input to make it not force would
  # describe a mode that barely differs: on a dispatch there is no `before` sha
  # to diff against, so the range degrades, `scripts/is-code-change` fails closed
  # to true, and the whole compile-and-test half runs either way. The two
  # positions would differ only in whether `deno` and `calibration` are
  # scheduled, and a knob that fine is a second copy of the forcing condition
  # waiting to disagree with the first.
  #
  # The trigger has to be on the default branch before it is offered at all, but
  # once it is, a run can target any ref carrying the file:
  # `gh workflow run ci --ref <branch>` uses that branch's copy of the workflow.
  workflow_dispatch:

# The default token is restricted; dorny/paths-filter needs pull-requests
# read access to list a PR's changed files via the API.
permissions:
  contents: read
  pull-requests: read

# Keyed on the event as well as the ref. Without `event_name` a manual run of
# `main` shares a group with a push to `main`, and `cancel-in-progress` makes the
# two evict each other: pressing the button kills the post-merge verification a
# merge just started, and a merge during a forced run kills the forced run. They
# are different questions about the same ref and both answers are wanted.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    # ONE definition of "this run forces the gates". The filter step reads it as
    # `env.FORCED` and the resolver reads it as `$FORCED`, so the predicate
    # cannot drift between them — two copies of it would mean a skipped filter
    # whose empty outputs are still consumed, which is a green run over a suite
    # that never ran.
    env:
      FORCED: ${{ github.event_name == 'workflow_dispatch' }}
    outputs:
      figma: ${{ steps.gates.outputs.figma }}
      packer: ${{ steps.gates.outputs.packer }}
      code: ${{ steps.gates.outputs.code }}
    steps:
      # Full history: the code detector below diffs two arbitrary commits,
      # which a shallow clone cannot resolve.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Skipped on a forced run, because its answer would be discarded. On an
      # event with no `before` sha the action does not compare the ref with the
      # default branch and find nothing — it logs that `before` is missing and
      # falls back to the diff of the tip commit alone. That is a well-defined
      # answer, and the wrong question here: a forced run wants every filter on
      # regardless of what the tip commit happened to touch.
      - uses: dorny/paths-filter@v3
        if: env.FORCED != 'true'
        id: filter
        with:
          # Both are declared with no default by the action and are ignored
          # outright on `pull_request`, so these two expressions are empty on
          # every event except a merge group and change nothing there.
          #
          # `base` is the one that has to be here. Its fallback is the
          # repository's default branch, so on a merge group the action would
          # otherwise compare the throwaway `gh-readonly-queue/...` ref against
          # `main` rather than against the commit the batch was built on.
          #
          # `ref` is redundant — the action falls back to the checked-out ref,
          # which on a merge group already points at `head_sha`. It is passed
          # anyway, and so is HEAD below, because no event this workflow can
          # currently receive produces a merge group: the first live evaluation
          # of these four expressions is the first queued merge. Naming the
          # payload's own values costs nothing and removes the dependency on
          # two fallbacks being what the documentation says they are.
          base: ${{ github.event.merge_group.base_sha }}
          ref: ${{ github.event.merge_group.head_sha }}
          filters: |
            figma:
              - 'importers/figma/**'
              # The committed fixture manifest is validated by the deno job
              # (manifest_test.ts), so editing it must trigger that job —
              # otherwise a malformed manifest merges with a green CI run
              # (issue #90).
              - 'corpus/figma-fixtures/**'
              # The deno suite calls dashc's wasm ABI and pins its output
              # against the golden .dsb. Both live on the Rust side, so a
              # Rust-only change can break the importer with no edit under
              # importers/ — without these, that change skips this job and
              # merges green against a boundary nothing checked (story #17).
              - 'crates/**'
              - 'goldens/dsb/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            # The calibration tier re-derives two committed asset tables from
            # the packer alone. This list is every input that can move them,
            # traced from what those two tests read rather than guessed
            # (docs/decisions/test-tiers.md).
            #
            # The profile-preview oracle is deliberately not covered here. It
            # checks a committed table too, but it renders through Skia and
            # reads the whole painter stack, so no honest path list could
            # bound it — it runs in the regression tier, on every push.
            packer:
              - 'crates/dashpack/**'
              - 'crates/dashpack-astcenc-sys/**'
              # AssetKind and its classification decide which rungs the ladder
              # walk considers at all, so a change here moves both tables.
              - 'crates/dashbuf/**'
              - 'corpus/**'
              - 'goldens/tooling/src/metric.rs'
              # The two tests' own helpers: the deterministic stress fixture
              # they both measure, and the repository-root lookup that finds
              # the committed payloads.
              #
              # Since story #836 this glob also covers `common/many_root.rs`,
              # the sixty-five-root document the two scaling criteria are
              # stated over, which the calibration tests do not read at all.
              # Kept as a glob rather than narrowed to a file list, on this
              # record's own frequency argument
              # (docs/decisions/test-tiers.md): over-triggering costs one
              # 272 s run on an edit to a scaling fixture, which is rare,
              # where under-triggering lets a committed table drift silently.
              # That is the opposite of the trade that removed
              # `.github/workflows/ci.yml` from this list, where the edits
              # were frequent and could not move a table.
              - 'goldens/tooling/tests/common/**'
              # The calibration table is the artifact under test; editing it
              # without re-deriving it is the exact drift this job exists to
              # catch. band_contract.rs needs no entry of its own, because
              # crates/dashpack/** already covers it.
              - 'goldens/tooling/tests/perceptual_calibration.rs'
              # A dependency bump can move an encoder's output without touching
              # any path above. The figma filter includes both for that reason.
              - 'Cargo.toml'
              - 'Cargo.lock'
              # The definition of the check itself: `.config/nextest.toml`
              # names the two tests by filter, and `.config/calibration-tier.txt`
              # pins the listing they must produce. Without these, the job that
              # exists to catch tier drift is the one job an edit to the tier
              # cannot trigger — which is how a membership check that had never
              # passed in CI reached `main` (issue #658).
              - '.config/**'

      # Whether anything outside documentation changed. The compile jobs gate
      # on this, so it asks the opposite question from the filters above: not
      # "did some changed file match" but "is EVERY changed file
      # documentation". dorny/paths-filter cannot express that. It reports
      # whether SOME file matched, and its negation syntax does not close the
      # gap — under the default predicate-quantifier a '!' pattern is matched
      # literally rather than treated as an exclusion, so an inverted filter
      # would report "nothing outside docs changed" for every pull request and
      # skip the entire suite while reporting green.
      #
      # Which way this fails is the point. Every path out of this step except
      # one reports code=true, so an empty diff, an unreadable diff, or a file
      # this does not recognise runs the full suite. Only a diff that was read
      # successfully and held nothing but documentation skips anything.
      - name: detect changes outside documentation
        id: code
        env:
          # BASE is what genuinely differs. A merge group carries neither a
          # pull request nor a `before` sha, so falling through to
          # `github.event.before` would leave it empty, degrade the range, and
          # fail closed to running everything on every merge.
          #
          # HEAD's middle arm is redundant, not a second asymmetry: `github.sha`
          # is already the merge group's head commit, so the existing tail would
          # have returned the same value. It is named explicitly for the reason
          # given on the filter step above — this whole path is first evaluated
          # against a live payload at the moment merges start depending on it.
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.sha }}
        run: |
          set -uo pipefail
          # Three dots, not two. BASE is the base branch's current tip, not the
          # merge base, so "git diff BASE HEAD" reports everything that landed on
          # main since this branch diverged as though this branch had changed it.
          # On a branch five commits behind main that read 34 files where the
          # pull request changed 3. "BASE...HEAD" diffs from the merge base
          # instead, which is the pull request's actual diff.
          #
          # The two forms agree only when BASE is an ancestor of HEAD, which is
          # why this shipped: the branch that verified it was cut from main's tip
          # moments earlier, so the check only ever exercised the case where the
          # bug cannot appear. For the push event they still agree whenever
          # "before" is an ancestor of "sha", and three dots degrades to the
          # merge base when a force-push means it is not.
          echo "changed files:"
          git diff --name-only --no-renames "$BASE...$HEAD" 2>/dev/null || true
          # The classification lives in scripts/is-code-change. `just verify`
          # called it too until the pre-push gate stopped running tests, and it
          # stays a script rather than shell inlined here because the rule can
          # then be run against a scratch repository — which is how the
          # rename-reports-only-the-destination defect was found. The script
          # carries the rule, the reasoning, and the
          # empty-diff-runs-everything default.
          code=$(scripts/is-code-change "$BASE...$HEAD")
          echo "code=$code" >>"$GITHUB_OUTPUT"
          echo "result: code=$code"

      # The job's three outputs come from here rather than straight off the
      # filter, so a manual run can force the jobs no ordinary diff schedules.
      # Everything downstream keeps gating on `needs.changes.outputs.*` and does
      # not know the difference.
      - name: resolve the gates
        id: gates
        env:
          FIGMA: ${{ steps.filter.outputs.figma }}
          PACKER: ${{ steps.filter.outputs.packer }}
          CODE: ${{ steps.code.outputs.code }}
        run: |
          set -uo pipefail
          if [ "$FORCED" = "true" ]; then
            echo "manual run: forcing every path-filtered job on."
            figma=true
            packer=true
            code=true
          else
            figma=$FIGMA
            packer=$PACKER
            code=$CODE
          fi
          # Fail closed on anything that is not a plain boolean. Every gate
          # downstream compares against the string `true`, so an EMPTY value
          # silently skips the job rather than failing it — and an empty value is
          # exactly what a step that did not run produces. This is the one place
          # in the workflow that could publish "nothing changed" without anyone
          # having decided that, so it refuses instead.
          for kv in "figma=$figma" "packer=$packer" "code=$code"; do
            case "${kv#*=}" in
              true | false) ;;
              *)
                echo "changes: refusing to publish '$kv' — the gates must be true or false."
                echo "  A gate that is neither skips its jobs and reports green over a suite"
                echo "  that never ran. Something upstream did not run as expected."
                exit 1
                ;;
            esac
            echo "$kv" >>"$GITHUB_OUTPUT"
            echo "  $kv"
          done

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # The Markdown/JSON/YAML/TOML gate. One job where there were two, because one
  # binary replaced dprint and markdownlint-cli both.
  #
  # It runs `just prim` rather than repeating the two verbs, so the gate cannot
  # drift from the one developers run. That recipe explains why both verbs are
  # needed; the short version is that `prim lint` does not see Markdown format
  # drift.
  #
  # Ungated by `changes`, like `fmt`, `audit` and `secrets`.
  #
  # PINNED, following the gitleaks install in this file and the flatc one in
  # `.github/actions/install-flatc`, which takes its version from the workspace
  # manifest. Pinned for the
  # same reason the old `markdownlint` job was pinned: prim reads only this
  # repository, so a release that changes a wrap decision would turn this job
  # red on a diff that changed nothing while the developer's own copy still
  # passes. See the `audit` job for the case that must NOT be pinned.
  #
  # Installed from the release tarball rather than `cargo install prim-cli`,
  # which compiles from source and would add minutes to every run.
  #
  # The checksum is written here rather than fetched from the release beside the
  # tarball, following the `secrets` job's gitleaks install. A checksum fetched
  # from the same server as the artifact proves the transfer was not corrupted
  # and nothing more; one committed here also has to match a byte the repository
  # already agreed to. `bootstrap` fetches the `.sha256` instead, because there
  # it sits beside two installs that already do and a per-platform table would be
  # four checksums to carry.
  prim:
    name: prim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install prim
        run: |
          v=0.3.0
          sha=d7054cf41ff14affc3d51520daa0a744911d224a8c0db9c34d8e07a133970d28
          curl -sSL --fail -o prim.tgz \
            "https://github.com/driftsys/prim/releases/download/v${v}/prim-x86_64-unknown-linux-musl.tar.gz"
          # --strict, as the flatc install uses for the reason issue #922
          # measured: without it a malformed checksum line is a warning and the
          # exit code stays 0. Safe by accident here today, since the line is
          # generated one field at a time; the flag makes it safe by
          # construction.
          echo "${sha}  prim.tgz" | sha256sum -c --strict -
          # Extracted whole into a scratch directory, then installed — rather
          # than naming the member the way the gitleaks step above does. prim's
          # tarball stores its entries as `./prim` and `./prim.1`, and whether
          # a bare `prim` matches `./prim` is the tar implementation's business.
          # This form does not ask. It also drops the man page, which the
          # selective form would have installed into the same directory.
          mkdir -p prim-unpack
          tar -xzf prim.tgz -C prim-unpack
          install -m 0755 prim-unpack/prim /usr/local/bin/prim
          rm -rf prim.tgz prim-unpack
          prim --version
      - uses: extractions/setup-just@v4
      - run: just prim

  # cargo audit, which `just lint` and `just check` run locally and which had no
  # CI job at all until the pre-push hook stopped being the place the whole gate
  # ran. Local-only enforcement was already the wrong shape once the repository
  # went public: a pull request from a fork runs whatever CI runs and nothing
  # else, and this was not in it.
  #
  # Ungated by `changes`, like `fmt`, `prim` and `secrets`. `cargo audit` fails
  # on a newly published advisory against a dependency that did not change, so
  # gating it on a path filter would mean the one job no diff can predict runs
  # only when some diff predicts it.
  #
  # `cargo audit` from a prebuilt binary, not `cargo install`. Compiling it from
  # source is minutes on a runner, and `Swatinem/rust-cache` cannot help:
  # `cargo install` builds in its own temp target directory, and the cache key
  # is derived from the workspace `Cargo.lock`, so the dependency bump that
  # makes an audit interesting is exactly what invalidates it. Every other tool
  # is fetched prebuilt, and the split worth knowing is whether that fetch is
  # checked. **Verified against a committed sha256**: `prim` and `gitleaks`
  # here, and `flatc` — whose fetch is not in this file at all, but in
  # `.github/actions/install-flatc/action.yml`, keyed since issue #922 by the
  # version that action derives from the manifest. **Not verified**:
  # `cargo-nextest`, piped from `get.nexte.st/latest` straight into tar at three
  # steps, unpinned, which is issue #657. Marketplace actions are a third shape
  # and a separate question: they are pinned by tag, not by digest.
  #
  # **No grep derives that split**, which is why it is written out. The fetches
  # live in two files and three shapes, and the obvious commands mislead: a
  # `curl|wget` grep of this file misses flatc entirely and matches this comment,
  # and a `sha256sum -c` grep reports flatc as unchecked. An install added here
  # joins this list by hand.
  #
  # DELIBERATELY UNPINNED, unlike every other tool in this file. `cargo audit`
  # reads a live upstream database rather than only the repository, so a pinned
  # version goes stale against a moving input and fails hard: pinning 0.21.2
  # here produced "error loading advisory database: parse error ...
  # RUSTSEC-2026-0109.md: TOML parse error at line 6", because that release
  # predates the advisory format now in the database. A stale pin is a certain
  # failure on someone else's schedule; tracking the tool is an uncertain one.
  #
  # Reproducibility was never available for this job in any case — the same
  # commit audits differently tomorrow, which is the point of auditing. The
  # `prim` job above is pinned because its input is this repository.
  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  # The publication gate. `just check` runs this locally; without a CI job it
  # is enforced only where a developer installed gitleaks by hand, which
  # `bootstrap` deliberately does not do.
  #
  # `fetch-depth: 0` is load-bearing. The default depth-1 checkout is a shallow
  # clone, and `just secrets` aborts on one rather than scanning a truncated
  # history — measured: a `--depth 1` clone reported "1094 objects read, none
  # missing" and passed, over a single commit.
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Checksum-verified, because AGENTS.md gives "a secret scanner fetched
      # over an unverified path is the wrong thing to add" as the reason
      # bootstrap does not install it — and this is the job whose output is
      # trusted to say the repository holds no credentials. `--fail` so a 404
      # body is not handed to tar.
      - name: install gitleaks
        run: |
          v=8.30.1
          sha=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSL --fail -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_linux_x64.tar.gz"
          echo "${sha}  gitleaks.tgz" | sha256sum -c --strict -
          tar -xz -C /usr/local/bin -f gitleaks.tgz gitleaks
          rm -f gitleaks.tgz
          gitleaks version
      - uses: extractions/setup-just@v4
      # BLAST RADIUS, stated because it is not obvious: fetch-depth 0 fetches
      # every branch, and the recipe scans `--all`. An untriaged value on any
      # branch therefore fails this job on every open PR, not only on the PR
      # that introduced it. That is the intended strictness for a publication
      # gate — nothing unpublishable should sit on any branch — but the fix is
      # to triage or remove the value at its source, not on the failing PR.
      - run: just secrets

  clippy:
    # Compile-heavy: skipped when the diff is documentation only
    # (see the changes job's detect step).
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4
      # This job compiles the whole workspace, which reaches dashbuf.
      - uses: ./.github/actions/install-flatc
      # The host target only. Everything wasm32 is the `wasm-gates` job, which
      # holds the whole of `just lint`'s wasm32 half in one place rather than
      # splitting it across two caches.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The intra-doc-link gate. Until issue #1108 it ran in NO CI job at all:
      # CI mirrors `just lint` piece by piece — `fmt`, `prim`, `clippy`,
      # `wasm-gates` — and this was the piece with no mirror, enforced only by
      # the pre-push hook. `just doc-links` rather than the command, so that
      # this file does not become the second copy that drifts.
      #
      # It shares a job with clippy for the third-party build and the cache,
      # NOT for the workspace one. `cargo clippy` sets RUSTC_WORKSPACE_WRAPPER,
      # which enters the fingerprint of workspace units only, so every
      # workspace member is re-checked here before it is documented; the
      # dependency graph beneath them is what gets reused. Measured in an
      # isolated CARGO_TARGET_DIR: a `cargo doc` immediately after a `cargo
      # clippy` of the same package still re-checks all five of its workspace
      # dependencies. A job of its own would rebuild the third-party graph too,
      # which is the larger half.
      - run: just doc-links

  test:
    # Compile-heavy: skipped when the diff is documentation only
    # (see the changes job's detect step).
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # This job writes the shared cache, because it is the member that runs
      # most often: every push that changes code. `render-oracle` runs on the
      # same condition but builds only a subset, and `calibration` needs a
      # `packer` path on top of it, so neither keeps the cache fresh enough
      # to be its writer. See the note on `calibration`.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-tests
      # Lavapipe, Mesa's software Vulkan device. Layer 2 of epic #569 — the
      # shader library's arithmetic, evaluated by compute shader
      # (`docs/decisions/shader-library-and-layer-2.md`) — needs a device, and
      # these runners have no GPU. Compute is what makes a software adapter
      # trustworthy here: it removes the rasteriser, the antialiasing resolve,
      # the blend stage and the sampler, leaving float arithmetic, which does
      # not shift with a Mesa version the way coverage and blending do. That is
      # also why layer 4 is measured on real hardware instead.
      #
      # Installed in this job rather than given one of its own, because the
      # conformance suite is an ordinary workspace test that happens to need a
      # device: giving it a separate job would mean excluding it from the tiers,
      # and it would then stop running on a developer's machine, where it works
      # against whatever adapter is present.
      #
      # **No `VK_ICD_FILENAMES`, and no driver path of any kind.** Mesa installs
      # its manifests into `/usr/share/vulkan/icd.d/`, which the loader already
      # searches by default — it is `$XDG_DATA_DIRS` (default
      # `/usr/local/share:/usr/share`) with `/vulkan/icd.d` appended
      # (Vulkan-Loader, `LoaderDriverInterface.md`). Setting a driver path could
      # therefore never help here, and `VK_ICD_FILENAMES` REPLACES that search
      # rather than adding to it, so pinning one filename could only ever break.
      #
      # It did. The job pinned `lvp_icd.x86_64.json`; Mesa dropped the
      # architecture suffix, the runner image moved from the noble Mesa that
      # shipped that name to the 25.2 in noble-updates that installs
      # `lvp_icd.json`, and the loader was left with no driver at all.
      # `vkCreateInstance` returned `VK_ERROR_INCOMPATIBLE_DRIVER`, the Vulkan
      # backend never became active, and wgpu reported `active_backends:
      # Backends(0x0)` inside whichever test asked for a device first — which is
      # why two `dashscene-gpu` residency tests failed at an `expect` naming
      # their own crate. `VK_ADD_DRIVER_FILES` adds instead of replacing, and is
      # what to reach for if a path is ever genuinely needed.
      #
      # No `WGPU_BACKEND` either. wgpu reads that only through
      # `InstanceDescriptor::from_env`, and the suite constructs its instance
      # with `Instance::default()`, so setting it would be a variable nothing
      # reads — and a comment claiming it steered the backend would be false.
      - name: install a software vulkan device
        run: |
          # Install first and refresh the package lists only if that fails,
          # following the skia step below: `apt-get update` is about 12 s on the
          # critical path of the job that runs most often, and the runner image
          # ships lists new enough to resolve these. The retry is what keeps
          # that an optimisation rather than a bet. `if !` rather than
          # `install || { update && install; }`, because under `bash -e` the
          # `||` form exits 0 when BOTH halves fail.
          if ! sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers vulkan-tools; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers vulkan-tools
          fi
          # Assert a working device, not a filename. A manifest that exists
          # proves nothing: its `library_path` can name a library a package
          # split moved, and a loader bump can stop honouring an override. This
          # exercises the same loader path wgpu will take, so an environment
          # fault fails HERE, by name, instead of surfacing as an `expect` in
          # whichever crate happens to ask for a device first.
          vulkaninfo --summary
          # `--summary` prints a `deviceName` line per physical device. An
          # instance that creates but enumerates nothing is refused by a wgpu
          # adapter request too, so the count is the gate rather than the exit
          # code alone.
          vulkaninfo --summary | grep -q "deviceName" || {
            echo "the vulkan loader created an instance but enumerated no device"
            exit 1
          }
      - uses: ./.github/actions/install-flatc
      # skia-safe's prebuilt Linux binaries link the system fontconfig;
      # the runner image ships the runtime library but not the -dev
      # symlink the linker needs.
      - name: install skia system libraries
        # Install first and refresh the package lists only if that fails.
        # `apt-get update` cost about 12 s of the roughly 20 s this step took
        # unconditionally, on the critical path of every job that runs it, and
        # the runner image already ships lists new enough to resolve this
        # package. The retry is what keeps that an optimisation rather than a
        # bet: if the lists ever are too stale, the install fails, the update
        # runs, and the install is retried.
        #
        # Written as `if !` rather than `install || { update && install; }`.
        # Under the `bash -e` these steps run with, the `||` form exits 0 when
        # BOTH the install and the update fail — the `&&` short-circuits, and
        # `set -e` does not fire for a compound command on the right of `||`.
        # The step would pass with the package still missing and the failure
        # would surface later as a linker error naming neither.
        run: |
          if ! sudo apt-get install -y libfontconfig1-dev; then
            sudo apt-get update
            sudo apt-get install -y libfontconfig1-dev
          fi
      # The regression tier (docs/decisions/test-tiers.md). nextest's default
      # profile is that tier, so no -P is needed here and a bare run cannot
      # silently be the thinner one.
      - name: install cargo-nextest
        run: curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ${CARGO_HOME:-~/.cargo}/bin
      - run: cargo nextest run --workspace
      # nextest does not run doctests.
      - run: cargo test --workspace --doc

  demo-build:
    # Compile-heavy: skipped when the diff is documentation only
    # (see the changes job's detect step).
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    name: demo-build
    runs-on: ubuntu-latest
    # The showcase host builds. That is the whole claim, and it is the only one
    # slice v0.14 makes (epic #568). The demonstration is run by a person, not
    # asserted by a suite: there is no golden producer, no coverage gate and no
    # fidelity check here, because a demonstration wired into CI becomes a suite
    # whose green state reads as evidence it never established — the
    # `t2-check-has-no-teeth` failure the v0.13 test tiering exists to remove.
    #
    # The runner has no GPU and no display, and this job needs neither. It never
    # opens a window; it compiles one. The build itself is headless-safe because
    # both Linux backends load their client libraries at run time rather than
    # linking them: winit's default features carry `wayland-dlopen`, and
    # softbuffer's carry `x11-dlopen` and `wayland-dlopen`. So no X11 or Wayland
    # development package is installed below — only the two the rest of the
    # workspace already needs.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `demo` reaches dashbuf through dashscene-core.
      - uses: ./.github/actions/install-flatc
      # skia-safe's prebuilt Linux binaries link the system fontconfig;
      # the runner image ships the runtime library but not the -dev
      # symlink the linker needs.
      - name: install skia system libraries
        # Install first and refresh the package lists only if that fails.
        # `apt-get update` cost about 12 s of the roughly 20 s this step took
        # unconditionally, on the critical path of every job that runs it, and
        # the runner image already ships lists new enough to resolve this
        # package. The retry is what keeps that an optimisation rather than a
        # bet: if the lists ever are too stale, the install fails, the update
        # runs, and the install is retried.
        #
        # Written as `if !` rather than `install || { update && install; }`.
        # Under the `bash -e` these steps run with, the `||` form exits 0 when
        # BOTH the install and the update fail — the `&&` short-circuits, and
        # `set -e` does not fire for a compound command on the right of `||`.
        # The step would pass with the package still missing and the failure
        # would surface later as a linker error naming neither.
        run: |
          if ! sudo apt-get install -y libfontconfig1-dev; then
            sudo apt-get update
            sudo apt-get install -y libfontconfig1-dev
          fi
      - run: cargo build -p demo

  convco:
    name: convco
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Lint the PR's own commits: the default pull_request checkout is
          # a synthetic "Merge X into Y" commit, which can never pass a
          # conventional-commit lint.
          ref: ${{ github.event.pull_request.head.sha }}
      - name: install git-std
        run: ./bootstrap
        env:
          GIT_STD_INSTALL_DIR: /usr/local/bin
          BOOTSTRAP_SKIP_NEXTEST: "1"
      - run: git std lint --range origin/${{ github.base_ref }}..HEAD

  deno:
    name: deno
    needs: [changes, wasm-build]
    runs-on: ubuntu-latest
    # Path-filtered: runs when the importer, the fixture corpus, or the Rust
    # side it calls across the wasm ABI changes
    # (docs/decisions/figma-importer-deno-plus-dashc-wasm.md /
    # docs/decisions/house-style.md).
    if: needs.changes.outputs.figma == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # The suite loads this module and asserts its output against the golden
      # .dsb. Taking it as an artifact keeps the Rust toolchain — and flatc —
      # out of this job; it is built once, in wasm-build.
      - uses: actions/download-artifact@v4
        with:
          name: dashc-wasm
          path: target/wasm32-unknown-unknown/release
      - working-directory: importers/figma
        run: |
          deno task check
          deno task lint
          deno task fmt --check
          deno task test

  wasm-build:
    # Compile-heavy: skipped when the diff is documentation only
    # (see the changes job's detect step).
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    name: wasm-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # dashc now depends on dashbuf (story #16: it emits .dsb), so the wasm
      # target needs flatc too, not just the native jobs.
      - uses: ./.github/actions/install-flatc
      # --lib: the bin target compiles to a second .wasm that is the CLI, exports
      # none of the ABI, and would sit next to the real module as a decoy.
      - run: cargo build -p dashc --lib --release --target wasm32-unknown-unknown
      - uses: actions/upload-artifact@v4
        with:
          name: dashc-wasm
          path: target/wasm32-unknown-unknown/release/dashc_wasm.wasm
          if-no-files-found: error

  wasm-gates:
    # Everything in `just check` and `just lint` that names
    # `wasm32-unknown-unknown` and is not `dashc`. Before this job, CI compiled
    # nothing for that triple but `dashc` and — from PR #901 to this one — one
    # clippy line for `dashscene-web` that sat in the `clippy` job. The other
    # gates ran on every developer's machine and on no runner (issue #903, found
    # by the review on story #835).
    #
    # What that cost is not hypothetical for the first two:
    #
    #   - `dashscene-gpu` is where `pollster::block_on` must never reach the
    #     web path. `pollster` is a native-only dependency, so a blocking wait
    #     that reached wasm fails here — and in a browser it would instead
    #     deadlock at run time against the very event loop that resolves the
    #     promise it waits on, which no native test can catch because natively
    #     it works (story #587).
    #   - `demo-web`'s browser half compiles on no other target at all.
    #   - `dashscene-web`'s `host` module is `#[cfg(target_arch = "wasm32")]`
    #     entire, and so is every test target that names what it holds
    #     (`tests/adapter_accessors.rs`, story #835).
    #
    # It runs the recipes rather than restating them, for the reason
    # `android-build` gives below: a second copy in YAML drifts against the
    # first, which is how a wasm32 line could be added to `just lint` and reach
    # no runner — issue #903 again, one crate later.
    #
    # One job rather than steps bolted onto `clippy` and `wasm-build`: these
    # share one wgpu-for-wasm32 compile, so one cache serves all of them, and
    # `deno` waits on `wasm-build` for its artifact and need not wait on these.
    #
    # Compile-heavy: skipped when the diff is documentation only
    # (see the changes job's detect step).
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    name: wasm-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4
      # `demo-web` reaches dashbuf.
      - uses: ./.github/actions/install-flatc
      - run: just wasm-painter
      - run: just wasm-host
      - run: just wasm-lint

  android-build:
    # Compile-heavy: skipped when the diff is documentation only
    # (see the changes job's detect step).
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    name: android-build
    runs-on: ubuntu-latest
    # The painter cross-compiles for the second platform. That is the whole
    # claim, and it is deliberately not more: which backend a device offers is
    # a property of that device, not of this build, and it is answered by
    # `just android-probe` against real hardware — D3a of
    # docs/decisions/host-integration-in-three-layers.md.
    #
    # A runner has no device and no GPU, so nothing here can measure D3a. A job
    # that appeared to would be worse than no job, which is the
    # `t2-check-has-no-teeth` failure the v0.13 tiering exists to remove.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # `clippy` for the `android-lint` step below. The `wasm-gates` job
          # asks for the same component for the same reason.
          components: clippy
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      # flatc is needed, though it was not while this job built the painter
      # alone: `dashscene-gpu` reaches no `dashbuf`, but `dashscene-ffi` depends
      # on it directly. The step was
      # removed when the job built only the painter and comes back with the ABI
      # — which is why the reason is recorded here, next to the job it is true
      # of, rather than being inferred from a sibling job having the step.
      - uses: ./.github/actions/install-flatc
      - uses: extractions/setup-just@v4
      # This job runs the recipe rather than inlining `cargo build`, which is
      # what every other compile job does. The difference is deliberate: the
      # recipe holds the NDK discovery, and inlining would put a second copy of
      # it in YAML to drift against the first — the failure this repository
      # keeps hitting with duplicated lists.
      #
      # The runner image sets ANDROID_NDK_ROOT, which the recipe reads, so
      # nothing is installed here for it.
      # The split-screen verdict, which needs no device and no toolchain.
      #
      # `just android-splitscreen` decides D4's third case from
      # HarnessActivity's logcat markers, and that recipe runs on no runner —
      # it needs an attached emulator, so nothing schedules it. The logic that
      # decides PASS or FAIL lives in `harness/verdict.sh` precisely so this
      # step can exercise it: reading that logic, which was all anyone could do
      # while it sat inline in the recipe, missed five distinct false verdicts
      # across two review rounds of PR #1177.
      #
      # Early in the job, and it costs milliseconds. A broken verdict fails
      # here rather than reaching whoever next spends ten minutes on an
      # emulator.
      - run: ./crates/dashscene-android/harness/verdict-test.sh
      - run: just android
      # The C ABI's conformance check, here rather than in a job of its own: it
      # needs only a C compiler, which every runner has, and this is already the
      # job that owns the FFI half of the tree.
      #
      # **It ran in no CI job at all until story #842.** `just c-abi` was added
      # to the local `check` recipe and nowhere else, so the one thing that
      # verifies `include/dashscene.h` declares what the library exports — and
      # that `DS_ABI_VERSION` equals what `ds_abi_version()` returns — could
      # drift and merge green. Bumping the constant on one side only is exactly
      # the change that would, and it is a published contract. The same shape as
      # issue #658, a membership check that had never passed in CI reaching
      # `main`.
      - run: just c-abi
      # And the Java, which before this step no job in this workflow compiled.
      #
      # `just android` cross-compiles the Rust members and stops. The harness
      # script was reachable only through `android-splitscreen`, which nothing
      # schedules, and `demo-android`'s script had no caller at all — so its two
      # Java files had been compiled by no one (issue #1030).
      #
      # This needs no device: both scripts package an APK from the `.so` the
      # first step built plus committed inputs. It is in this job rather than a
      # new one because this is the job that already produces that `.so`.
      #
      # **Late, deliberately.** It depends on the runner's SDK, so a failure
      # here must not mask `c-abi` above — the only check that
      # `include/dashscene.h` matches what the library exports.
      #
      # The runner image ships the Android SDK and a JDK, so nothing is
      # installed here — the same reasoning as the NDK note above, and the same
      # exposure: an image that stopped shipping them would fail here rather
      # than silently skip, which is the correct direction. The JDK is taken
      # from the image rather than pinned, which issue #1058 carries.
      - run: just android-apk
      # And clippy on the same triple, which ran nowhere until issue #1086.
      #
      # `just android` is `cargo build`, so the platform half of
      # `dashscene-android` (`host.rs`, `loop_.rs`) and `demo-android`'s JNI
      # half — code those crates' own docs describe as reachable by no test —
      # compiled without being linted. `just wasm-lint` closed the same gap for
      # wasm32 at PR #907; this is the Android half of that rule.
      #
      # It is not redundant with the `clippy` job: that one runs
      # `--workspace --all-targets` on the **host** triple, where every
      # `cfg(target_os = "android")` item is compiled out entirely.
      #
      # **Last, and for the reason the step above states about itself.** This is
      # now the newest step, and the one most exposed to the toolchain: it is
      # `-D warnings` under an unpinned `dtolnay/rust-toolchain@stable`, so a
      # stable release that adds a lint — or that fixes the
      # `missing_const_for_thread_local` false positive, turning the `#[expect]`
      # in `dashscene-ffi` into an `unfulfilled_lint_expectations` error — turns
      # this job red. Ahead of `c-abi` it would take the header conformance
      # check and the Java compile down with it; here it takes only itself.
      #
      # The recipe rather than an inlined list, for the reason `just android`
      # above gives.
      - run: just android-lint

  atlas-repro:
    # Compile-heavy: skipped when the diff is documentation only
    # (see the changes job's detect step).
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    name: atlas-repro (${{ matrix.arch }})
    # Both architectures, because the fixtures are checked on both and
    # each catches what the other cannot. The committed atlases are not
    # byte-identical across CPU architectures — msdf-atlas-gen's
    # floating-point arithmetic differs, so a fixture baked on arm64
    # decodes a few pixels away from the x86_64 one, each by a single
    # channel step (story #654). The reproducibility tests compare
    # decoded samples under bounds that admit exactly that noise, so one
    # committed fixture is checkable on either runner.
    #
    # Same-machine determinism is still asserted byte for byte, by
    # `double_run_is_byte_identical` and its Arabic twin, which run on
    # both legs here.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      # Commit SHA of the upstream v1.4 tag (tags are movable; a SHA is
      # not). The version this builds must match REQUIRED_TOOL_VERSION
      # in crates/dashscene-typeset/src/atlas/tool.rs — the version
      # gate there fails the job on any mismatch.
      MAG_REF: 2ede254314a2512252a225fa6c975948d6af559a
    steps:
      - uses: actions/checkout@v4
      - name: cache msdf-atlas-gen
        id: cache-tool
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/msdf-atlas-gen
          # If a runner-image upgrade breaks the cached dynamically
          # linked binary (loader error, surfaced by the version
          # probe's stderr), delete this cache entry to force a
          # rebuild.
          #
          # `runner.arch` is part of the key, not decoration:
          # `runner.os` is `Linux` on both x86_64 and arm64, so without
          # it this job would restore an x86_64 binary onto an arm64
          # runner and fail on the exec, not on anything it tests.
          key: msdf-atlas-gen-${{ env.MAG_REF }}-${{ runner.os }}-${{ runner.arch }}
      - name: build msdf-atlas-gen
        if: steps.cache-tool.outputs.cache-hit != 'true'
        # Upstream publishes Windows binaries only; build the pinned
        # commit once and cache it.
        run: |
          if ! sudo apt-get install -y cmake libfreetype-dev; then
            sudo apt-get update
            sudo apt-get install -y cmake libfreetype-dev
          fi
          git init "$RUNNER_TEMP/mag"
          git -C "$RUNNER_TEMP/mag" remote add origin https://github.com/Chlumsky/msdf-atlas-gen.git
          git -C "$RUNNER_TEMP/mag" fetch --depth 1 origin "$MAG_REF"
          git -C "$RUNNER_TEMP/mag" checkout FETCH_HEAD
          git -C "$RUNNER_TEMP/mag" submodule update --init --depth 1
          cmake -S "$RUNNER_TEMP/mag" -B "$RUNNER_TEMP/mag/build" \
            -DCMAKE_BUILD_TYPE=Release -DMSDF_ATLAS_USE_VCPKG=OFF \
            -DMSDF_ATLAS_USE_SKIA=OFF -DMSDF_ATLAS_NO_ARTERY_FONT=ON \
            -DMSDF_ATLAS_INSTALL=OFF
          cmake --build "$RUNNER_TEMP/mag/build" -j"$(nproc)"
          mkdir -p ~/.local/bin
          install -m 0755 "$(find "$RUNNER_TEMP/mag/build" -name msdf-atlas-gen -type f)" \
            ~/.local/bin/msdf-atlas-gen
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: atlas pipeline tests (tool required)
        # Scoped to the tool-gated integration tests; the unit tests
        # already run in the `test` job.
        run: cargo test -p dashscene-typeset --test atlas_pipeline
        env:
          DASHSCENE_REQUIRE_ATLAS_TOOL: "1"
          MSDF_ATLAS_GEN: /home/runner/.local/bin/msdf-atlas-gen

  render-oracle:
    # Compile-heavy: skipped when the diff is documentation only
    # (see the changes job's detect step).
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    name: render-oracle
    runs-on: ubuntu-latest
    # The design-source render oracle (exit criterion E7, guardrail G-11):
    # a perceptual diff of the Skia reference painter against Figma's REST
    # image export, with per-rule tolerance bands. Each measured frame imports
    # its committed Figma fixture in-process, renders it, and diffs that render
    # against the committed export. The suite also runs in the `test` job; this
    # job re-runs it in isolation with --nocapture so the measured per-frame
    # numbers, and the pending frames, show in the CI log. E7 is partial: the
    # two layout frames (v08-wrap, v08-grid-spans) are measured; the shadow and
    # text frames are a disclosed follow-on that needs a renderable fixture
    # and/or the text render path (docs/specification/05-qualification.md).
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Keeps a cache of its own. It compiles a strict subset of what `test`
      # compiles, and sharing that key made this job slower rather than
      # faster: 62 s to 101 s, because it restored 377 MB built for the full
      # 108-binary suite in place of the smaller cache that matched exactly
      # what it builds (issue #680).
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/install-flatc
      # skia-safe's prebuilt Linux binaries link the system fontconfig.
      - name: install skia system libraries
        # Install first and refresh the package lists only if that fails.
        # `apt-get update` cost about 12 s of the roughly 20 s this step took
        # unconditionally, on the critical path of every job that runs it, and
        # the runner image already ships lists new enough to resolve this
        # package. The retry is what keeps that an optimisation rather than a
        # bet: if the lists ever are too stale, the install fails, the update
        # runs, and the install is retried.
        #
        # Written as `if !` rather than `install || { update && install; }`.
        # Under the `bash -e` these steps run with, the `||` form exits 0 when
        # BOTH the install and the update fail — the `&&` short-circuits, and
        # `set -e` does not fire for a compound command on the right of `||`.
        # The step would pass with the package still missing and the failure
        # would surface later as a linker error naming neither.
        run: |
          if ! sudo apt-get install -y libfontconfig1-dev; then
            sudo apt-get update
            sudo apt-get install -y libfontconfig1-dev
          fi
      - name: design-source render oracle (E7 / G-11)
        run: cargo test -p goldens --test render_oracle -- --nocapture
      # Every golden carrying a calibrated absolute-pixel budget, for the
      # measured number rather than the pass/fail (issue #539). They are
      # recorded on macOS arm64 and this runner is x86_64, so every run of
      # them is already a cross-architecture diff — the comparison prints
      # its residual on a within-budget pass, but the `test` job runs
      # under nextest, which captures it. Re-run here with --nocapture for
      # the same reason the oracle above is: the measured number belongs
      # in the log, where a budget can be calibrated against it instead of
      # extrapolated.
      #
      # Regenerate this list rather than trusting it — a golden added to
      # the class and not added here is measured by nothing:
      #   grep -rl assert_matches_golden_max_pixels goldens/tooling/tests/
      #
      # `v03` is in the list although it carries a fraction tolerance
      # rather than a pixel budget. It renders `v03-paint`, the scene the
      # 32 px anchor every other budget extrapolates from was measured
      # on. Measuring the anchor in the same run as the budgets derived
      # from it is what makes the comparison sound: otherwise today's
      # residuals are being read against a figure taken on an older Skia,
      # on hardware nobody has described.
      - name: calibrated-budget cross-architecture residuals (issue #539)
        run: |
          cargo test -p goldens \
            --test v05_text \
            --test v06_arabic \
            --test v07_fallback \
            --test v07_text_lowering \
            --test v07_variant_topology \
            --test v013_uncovered_shapes \
            --test v07_ellipse \
            --test v03 \
            -- --nocapture
      # The startup-scaling criterion — R5's falsifiable form under guardrail
      # G-20 (story #598, epic #594). It runs in the `test` job as an ordinary
      # `regression` test, and its assertion is an equality that says only
      # pass or fail. The numbers it prints — the two counts, the ratio, the
      # wall clock and the machine — are the record issue #598 asks for, and
      # nextest captures a passing test's stdout, so re-run here with
      # --nocapture for exactly the reason the two steps above are re-run.
      #
      # It carried its own profile and a `just scaling` recipe while it was
      # knowingly red, and `--success-output=immediate` on that recipe is what
      # used to make the number visible. The profile and the recipe went away
      # when the criterion passed; this step is what replaces them, so that
      # deleting them did not quietly delete the measurement
      # (docs/decisions/test-tiers.md).
      - name: startup-scaling criterion (R5 / G-20)
        run: cargo test -p goldens --test startup_scaling -- --nocapture
      # The per-frame scaling criterion — the sibling of the one above, and the
      # half R5's benchmark does not cover (story #836, epic #833). Same
      # reasoning for the same reason: it runs in the `test` job as an ordinary
      # `regression` test whose assertions are equalities, and the numbers it
      # prints — the solve and committed-table counts per frame, the ratio, and
      # the machine — are the record story #838 re-measures against when it
      # confines both to the shown root.
      - name: per-frame scaling criterion (#822's per-frame half)
        run: cargo test -p goldens --test per_frame_scaling -- --nocapture

  calibration:
    name: calibration
    needs: [changes]
    runs-on: ubuntu-latest
    # Path-filtered: the two tests here re-derive the committed asset tables,
    # and the `packer` filter above lists every input that can move them —
    # traced from what those two tests read, not guessed. Running them on
    # every push would put about 3 min of re-derivation behind every
    # unrelated change; running them on nobody's schedule would let the
    # tables drift. The filter is the compromise, and it defines a risky
    # change by what the diff touches rather than by anyone's judgement
    # (docs/decisions/test-tiers.md).
    #
    # The profile-preview oracle is deliberately not here. It checks a
    # committed table too, but it renders through Skia and reads the whole
    # painter stack, so no honest path list could bound it — it runs in the
    # regression tier, on every push.
    if: needs.changes.outputs.packer == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Reads the shared cache `test` writes; does not write one of its own.
      # rust-cache keys on the job name by default, and this job runs only
      # when the `packer` filter fires — so its own key was almost never
      # populated, and it compiled all 108 test binaries from scratch on a
      # run where `test` had just compiled the same ones in 69 s. Measured on
      # PR #674: `No cache found`, 3 min 14 s of compiling, on a 9 min 47 s
      # job. It builds exactly what `test` builds, so it can read that cache.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-tests
          save-if: "false"
      - uses: ./.github/actions/install-flatc
      # skia-safe's prebuilt Linux binaries link the system fontconfig; the
      # runner image ships the runtime library but not the -dev symlink the
      # linker needs. The `goldens` crate that perceptual_calibration.rs
      # belongs to links skia-safe unconditionally, so building its test
      # binaries needs this even though these two tests never call it.
      - name: install skia system libraries
        # Install first and refresh the package lists only if that fails.
        # `apt-get update` cost about 12 s of the roughly 20 s this step took
        # unconditionally, on the critical path of every job that runs it, and
        # the runner image already ships lists new enough to resolve this
        # package. The retry is what keeps that an optimisation rather than a
        # bet: if the lists ever are too stale, the install fails, the update
        # runs, and the install is retried.
        #
        # Written as `if !` rather than `install || { update && install; }`.
        # Under the `bash -e` these steps run with, the `||` form exits 0 when
        # BOTH the install and the update fail — the `&&` short-circuits, and
        # `set -e` does not fire for a compound command on the right of `||`.
        # The step would pass with the package still missing and the failure
        # would surface later as a linker error naming neither.
        run: |
          if ! sudo apt-get install -y libfontconfig1-dev; then
            sudo apt-get update
            sudo apt-get install -y libfontconfig1-dev
          fi
      - name: install cargo-nextest
        run: curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ${CARGO_HOME:-~/.cargo}/bin
      # The same check the `calibrate` recipe runs, inline because this job does
      # not install `just`. It comes first: the profiles select by exact test
      # name, so a rename drops a test out of the tier silently, and no count
      # catches that — the tiers partition the suite, so the totals reconcile
      # either way. Keep this identical to the recipe.
      #
      # `shell: bash` for the pipefail it brings: the default `bash -e` takes
      # the pipeline's status from `diff` alone, so a `nextest list` that fails
      # outright would feed an empty listing into a passing-looking diff.
      - name: calibration tier membership
        shell: bash
        run: |
          cargo nextest list --workspace -P calibration --message-format json \
            | jq -r '."rust-suites" | to_entries[] as $s | $s.value.testcases | to_entries[] | select(.value."filter-match".status == "matches") | "\($s.key) \(.key)"' \
            | LC_ALL=C sort \
            | diff -u .config/calibration-tier.txt -
      - name: calibration tier
        run: cargo nextest run --workspace -P calibration

  exit-gate:
    name: exit-gate
    # The v0 exit gate (story #49, epic #47). Every criterion E1 to E7 is
    # individually met and individually evidenced in
    # docs/specification/05-qualification.md. What this job adds is the single
    # mechanical assertion that they are ALL met on a given commit, so that a
    # regression in any one of them fails a build rather than being noticed by
    # a person.
    #
    # It needs `deno` because E6 is the one criterion no single job can prove.
    # Byte-identity is transitive only because two suites on two machines
    # assert against the same committed bytes: the native library call, which
    # the exit-gate profile runs in `exit-gate-tests`, and
    # importers/figma/src/wasm_test.ts, which runs in `deno`. Requiring that
    # job is how the second half is held.
    #
    # Split in two. This job holds only the conjunction — the part that must
    # wait, because it reads the other jobs' results — and it costs seconds.
    # The covering tests themselves live in `exit-gate-tests`, which depends on
    # nothing but the checkout and so starts with everything else.
    #
    # They were one job, and that job could not begin until `test`,
    # `render-oracle` and `wasm-build` had all finished. Measured on main run
    # 30739249702: it started at 255 s and ran for 110 s, of which the
    # conjunction step was 0 s, the covering tests 2 s, and 86 s was compiling
    # the workspace so that `nextest list` could enumerate them. That is 110 s
    # of almost entirely unrelated work, serialized behind jobs it does not
    # read, on every code push.
    needs: [changes, test, deno, render-oracle, wasm-build, exit-gate-tests]
    # `!cancelled()` rather than `always()`: the two agree for success, failure
    # and skipped, and differ only on a cancelled run, where `always()` would
    # provision a runner for a result nobody is waiting for.
    #
    # `code == 'true'` so that a green exit-gate keeps meaning E1-E7 were
    # asserted on this commit. On a documentation-only diff the jobs carrying
    # the criteria skip by design, and a job that reported success there would
    # be claiming an assertion it did not make.
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      # The whole job. It reads results and provisions nothing — no checkout,
      # no toolchain, no build — which is what lets the part that does provision
      # run in parallel as `exit-gate-tests` instead of after these jobs.
      - name: the jobs carrying E1-E7 succeeded
        run: |
          echo 'test=${{ needs.test.result }} deno=${{ needs.deno.result }} render-oracle=${{ needs.render-oracle.result }} wasm-build=${{ needs.wasm-build.result }} exit-gate-tests=${{ needs.exit-gate-tests.result }}'
          for pair in "test:${{ needs.test.result }}" "render-oracle:${{ needs.render-oracle.result }}" "wasm-build:${{ needs.wasm-build.result }}" "exit-gate-tests:${{ needs.exit-gate-tests.result }}"; do
            name="${pair%%:*}"; result="${pair#*:}"
            if [ "$result" != "success" ]; then
              echo "exit-gate: $name did not succeed ($result) — E1-E7 is not asserted"
              exit 1
            fi
          done
          # E6's wasm half is the deno job, and it is path-filtered. A skip is
          # only acceptable when the filter is what skipped it: wasm-build is
          # required above, so deno cannot be skipped by a failed dependency
          # without that being caught first. When the figma filter did fire,
          # deno must have succeeded.
          if [ '${{ needs.changes.outputs.figma }}' = 'true' ] \
             && [ '${{ needs.deno.result }}' != 'success' ]; then
            echo "exit-gate: the figma filter fired but deno is ${{ needs.deno.result }} — E6's wasm half is not asserted"
            exit 1
          fi
  exit-gate-tests:
    name: exit-gate-tests
    # The measuring half of the v0 exit gate: the covering tests for E1 to E7
    # exist, and they pass. Nothing here reads another job's result, so it
    # needs only `changes` and runs beside `test` rather than after it. The
    # conjunction that does read those results is the `exit-gate` job below.
    #
    # Same `code == 'true'` condition as the jobs carrying the criteria: on a
    # documentation-only diff they skip, and so does this.
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Reads the shared cache `test` writes. `cargo nextest list --workspace`
      # below builds the same full set of native test binaries `test` builds,
      # which is the condition for sharing that key rather than keeping one of
      # its own (docs/decisions/test-tiers.md).
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-tests
          save-if: "false"
      - uses: ./.github/actions/install-flatc
      - name: install skia system libraries
        # Install first and refresh the package lists only if that fails.
        # `apt-get update` cost about 12 s of the roughly 20 s this step took
        # unconditionally, on the critical path of every job that runs it, and
        # the runner image already ships lists new enough to resolve this
        # package. The retry is what keeps that an optimisation rather than a
        # bet: if the lists ever are too stale, the install fails, the update
        # runs, and the install is retried.
        #
        # Written as `if !` rather than `install || { update && install; }`.
        # Under the `bash -e` these steps run with, the `||` form exits 0 when
        # BOTH the install and the update fail — the `&&` short-circuits, and
        # `set -e` does not fire for a compound command on the right of `||`.
        # The step would pass with the package still missing and the failure
        # would surface later as a linker error naming neither.
        run: |
          if ! sudo apt-get install -y libfontconfig1-dev; then
            sudo apt-get update
            sudo apt-get install -y libfontconfig1-dev
          fi
      - name: install cargo-nextest
        run: curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ${CARGO_HOME:-~/.cargo}/bin
      # The membership check comes first: the profile selects by exact test
      # name, so renaming a covering test drops it out of the gate silently.
      - name: every covering test still exists
        # `shell: bash` for the pipefail it brings, the same reason the
        # calibration step sets it: the default `bash -e` takes the pipeline's
        # status from `diff` alone, so a `cargo nextest list` that failed
        # outright would not be reported as the build failure it is.
        shell: bash
        run: |
          cargo nextest list --workspace -P exit-gate --message-format json \
            | jq -r '."rust-suites" | to_entries[] as $s | $s.value.testcases | to_entries[] | select(.value."filter-match".status == "matches") | "\($s.key) \(.key)"' \
            | LC_ALL=C sort \
            | diff -u .config/exit-gate.txt -
      - name: E1-E7 covering tests pass
        run: cargo nextest run --workspace -P exit-gate

  ci:
    name: ci
    if: always()
    # Every job in the workflow, so a red anywhere fails the aggregate
    # (docs/decisions/house-style.md). "skipped" is accepted: convco only runs on
    # pull requests, deno only when importers/figma/ changed, and calibration
    # only when the packer paths changed (docs/decisions/test-tiers.md).
    # clippy, test, demo-build, wasm-build, wasm-gates, android-build,
    # atlas-repro, render-oracle, exit-gate-tests and exit-gate all skip when
    # the diff is documentation only, which also skips deno through its
    # dependency on wasm-build. The list is every job carrying
    # `needs.changes.outputs.code == 'true'`, which is how to re-derive it
    # rather than trusting this sentence. This is the reason a
    # green aggregate cannot be read as "the suite ran": read the jobs, not the
    # aggregate.
    needs:
      [
        changes,
        fmt,
        prim,
        audit,
        clippy,
        test,
        demo-build,
        wasm-build,
        wasm-gates,
        android-build,
        convco,
        secrets,
        deno,
        atlas-repro,
        render-oracle,
        calibration,
        exit-gate-tests,
        exit-gate,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: check required jobs
        run: |
          echo '${{ toJSON(needs) }}'
          for result in $(echo '${{ toJSON(needs.*.result) }}' | tr -d '[],"'); do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "a required job did not succeed: $result"
              exit 1
            fi
          done
